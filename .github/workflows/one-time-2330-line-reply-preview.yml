name: One-Time 2330 Live LINE Reply Preview (READ ONLY)
on:
  push:
    branches: [feature/line-chip-freshness-live-preview-20261121]
    paths:
      - ".github/workflows/one-time-2330-line-reply-preview.yml"
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LINE_STOCK_READONLY_PREVIEW: "yes"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Node PostgreSQL client
        working-directory: line-stock-analysis
        run: npm install --no-audit --no-fund
      - name: Read-only Neon stock reply preview, no LINE transport
        working-directory: line-stock-analysis
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::DATABASE_URL missing"; exit 1; fi
          node readonly-live-preview.mjs
