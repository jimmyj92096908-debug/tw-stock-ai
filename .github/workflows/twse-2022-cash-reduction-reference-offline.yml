name: TWSE 2022 Cash Reduction Reference (Offline Tests)

on:
  pull_request:
    paths:
      - 'scripts/twse_2022_cash_reduction_reference_readonly.py'
      - 'tests/test_twse_2022_cash_reduction_reference_readonly.py'
      - '.github/workflows/twse-2022-cash-reduction-reference-offline.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/twse_2022_cash_reduction_reference_readonly.py'
      - 'tests/test_twse_2022_cash_reduction_reference_readonly.py'
      - '.github/workflows/twse-2022-cash-reduction-reference-offline.yml'

permissions:
  contents: read

jobs:
  exchange-reference-formula-and-no-release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ''
      STOCK_ARCHIVE_KEY_HEX: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing free dependencies
        run: python -m pip install -r requirements.txt
      - name: Synthetic-only cash reduction reference and halt evidence
        run: |
          unset PYTHONPATH
          python -m py_compile scripts/twse_2022_cash_reduction_reference_readonly.py
          python -m scripts.twse_2022_cash_reduction_reference_readonly --help >/dev/null
          python -m unittest tests.test_twse_2022_cash_reduction_reference_readonly -v
