name: Owner TWSE Action Window Candidates (Offline)
on:
  pull_request:
    paths:
      - 'scripts/owner_twse_action_window_candidates.py'
      - 'tests/test_owner_twse_action_window_candidates.py'
      - '.github/workflows/owner-twse-action-window-candidates-offline.yml'
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v tests.test_owner_twse_action_window_candidates
