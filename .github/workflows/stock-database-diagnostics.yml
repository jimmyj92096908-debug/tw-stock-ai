name: Stock Database Diagnostics (Isolated CI)

on:
  push:
    branches:
      - "feature/**"
    paths:
      - "src/stock_db_audit.py"
      - "src/full_market_refresh.py"
      - "tests/test_full_market_refresh.py"
      - "src/send_line_report.py"
      - "src/composite_score.py"
      - "tests/test_composite_score_selection.py"
      - "tests/test_composite_score_idempotent.py"
      - "tests/test_stock_db_audit.py"
      - "src/official_market_feed.py"
      - "src/official_snapshot_ingest.py"
      - "src/twse_dated_history.py"
      - "src/batch_indicator_catchup.py"
      - "tests/test_batch_indicator_catchup.py"
      - "tests/test_batch_indicator_catchup_postgres.py"
      - ".github/workflows/daily-twse-dated-history.yml"
      - ".github/workflows/daily-indicator-catchup.yml"
      - "tests/test_live_data_workflow_guards.py"
      - "tests/test_twse_dated_history.py"
      - "tests/test_twse_dated_history_postgres.py"
      - "src/targeted_history_refresh.py"
      - "tests/test_targeted_history_refresh.py"
      - "tests/test_official_market_feed.py"
      - "tests/test_official_snapshot_db.py"
      - "tests/test_refresh_rotation_db.py"
      - "tests/test_send_line_report.py"
      - "tests/test_send_line_report_queries.py"
      - "tests/test_send_line_report_delivery.py"
      - "scripts/score_after_refresh.py"
      - "tests/test_score_after_refresh.py"
      - ".github/workflows/composite-after-market-refresh.yml"
      - ".github/workflows/stock-database-diagnostics.yml"
  pull_request:
    paths:
      - "src/stock_db_audit.py"
      - "src/full_market_refresh.py"
      - "tests/test_full_market_refresh.py"
      - "src/send_line_report.py"
      - "src/composite_score.py"
      - "tests/test_composite_score_selection.py"
      - "tests/test_composite_score_idempotent.py"
      - "tests/test_stock_db_audit.py"
      - "src/official_market_feed.py"
      - "src/official_snapshot_ingest.py"
      - "src/twse_dated_history.py"
      - "src/batch_indicator_catchup.py"
      - "tests/test_batch_indicator_catchup.py"
      - "tests/test_batch_indicator_catchup_postgres.py"
      - ".github/workflows/daily-twse-dated-history.yml"
      - ".github/workflows/daily-indicator-catchup.yml"
      - "tests/test_live_data_workflow_guards.py"
      - "tests/test_twse_dated_history.py"
      - "tests/test_twse_dated_history_postgres.py"
      - "src/targeted_history_refresh.py"
      - "tests/test_targeted_history_refresh.py"
      - "tests/test_official_market_feed.py"
      - "tests/test_official_snapshot_db.py"
      - "tests/test_refresh_rotation_db.py"
      - "tests/test_send_line_report.py"
      - "tests/test_send_line_report_queries.py"
      - "tests/test_send_line_report_delivery.py"
      - "scripts/score_after_refresh.py"
      - "tests/test_score_after_refresh.py"
      - ".github/workflows/composite-after-market-refresh.yml"
      - ".github/workflows/stock-database-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: stock_ci_test
          POSTGRES_USER: stock_ci_test
          POSTGRES_PASSWORD: ci-disposable-stock-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stock_ci_test -d stock_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: src
      STOCK_CI_POSTGRES_URL: postgresql://stock_ci_test:ci-disposable-stock-only@127.0.0.1:5432/stock_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile data import and audit scripts
        run: |
          python -m py_compile src/stock_db_audit.py src/full_market_refresh.py src/send_line_report.py src/official_market_feed.py src/official_snapshot_ingest.py src/targeted_history_refresh.py src/composite_score.py src/twse_dated_history.py src/batch_indicator_catchup.py
      - name: Test coverage audit, report dates and PostgreSQL batch rotation
        run: |
          python -m unittest -v tests.test_stock_db_audit tests.test_send_line_report tests.test_send_line_report_queries tests.test_send_line_report_delivery tests.test_refresh_rotation_db tests.test_full_market_refresh tests.test_score_after_refresh tests.test_official_market_feed tests.test_official_snapshot_db tests.test_targeted_history_refresh tests.test_composite_score_selection tests.test_composite_score_idempotent tests.test_twse_dated_history tests.test_twse_dated_history_postgres tests.test_batch_indicator_catchup tests.test_batch_indicator_catchup_postgres tests.test_live_data_workflow_guards
      - name: Ensure test database connection never targets Neon
        run: |
          python -c "import os; from urllib.parse import urlparse; u=urlparse(os.environ['STOCK_CI_POSTGRES_URL']); assert u.hostname=='127.0.0.1' and u.path=='/stock_ci_test'"
