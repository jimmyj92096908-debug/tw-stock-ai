name: TWSE 2022 Event-Only 240 SMA (Synthetic Offline Tests)

on:
  pull_request:
    paths:
      - 'scripts/twse_2022_reduction_only_240_sma_readonly.py'
      - 'tests/test_twse_2022_reduction_only_240_sma_readonly.py'
      - '.github/workflows/twse-2022-reduction-only-sma240-offline.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/twse_2022_reduction_only_240_sma_readonly.py'
      - 'tests/test_twse_2022_reduction_only_240_sma_readonly.py'
      - '.github/workflows/twse-2022-reduction-only-sma240-offline.yml'

permissions:
  contents: read

jobs:
  no-production-credentials-no-private-data:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ''
      STOCK_ARCHIVE_KEY_HEX: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing free Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Test no future-aware backtest and genuine event-only research gating
        run: |
          unset PYTHONPATH
          python -m py_compile scripts/twse_2022_reduction_only_240_sma_readonly.py
          python -m scripts.twse_2022_reduction_only_240_sma_readonly --help >/dev/null
          python -m unittest tests.test_twse_2022_reduction_only_240_sma_readonly -v
