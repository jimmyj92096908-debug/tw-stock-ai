name: One-Time Chip History Gap Preview (READ ONLY)
on:
  push:
    branches:
      - feature/chip-history-safe-pipeline-20261120
    paths:
      - ".github/workflows/one-time-chip-history-preview.yml"
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CHIP_HISTORY_WRITE_ENABLED: "no"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only read-only diagnostic dependencies
        run: python -m pip install "psycopg[binary]>=3.2,<4" requests
      - name: Test source contracts offline
        run: python -m unittest tests.test_chip_history_backfill tests.test_daily_chip_ingest tests.test_chip_score -v
      - name: Preview real 2330 chip history gaps (no HTTP and no SQL writes)
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing DATABASE_URL"; exit 1
          fi
          python src/chip_history_backfill.py --stock 2330 --days 25
