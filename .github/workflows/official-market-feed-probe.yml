name: Official Market Data Feed Probe (Read Only)
on:
  push:
    branches: ["feature/line-stock-code-analysis"]
    paths: [".github/workflows/official-market-feed-probe.yml", "src/official_market_feed.py", "tests/test_official_market_feed.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe only two official, public HTTPS market feeds
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error,time
          sources={
            'twse':'https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL',
            'tpex':'https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes',
            'twse-20261119':'https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20261119&type=ALLBUT0999&response=json',
          }
          for name,url in sources.items():
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; tw-stock-ai/1.0)', 'Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=25) as resp:
                raw=resp.read(10_000_000)
              data=json.loads(raw)
              print(name, 'top_type',type(data).__name__, 'item_count',len(data) if hasattr(data,'__len__') else 'na')
              if isinstance(data,list) and data:
                print(name,'first_keys',sorted(data[0].keys()))
                print(name,'first_row',json.dumps(data[0],ensure_ascii=False)[:900])
                print(name,'second_row',json.dumps(data[1],ensure_ascii=False)[:900] if len(data)>1 else 'na')
              elif isinstance(data,dict):
                print(name,'top_keys',sorted(data.keys()),'stat',str(data.get('stat'))[:120])
                for table in data.get('tables',[])[:12]:
                  fields=table.get('fields',[])
                  if '證券代號' in fields or '證券名稱' in fields:
                    print(name,'market_table_title',str(table.get('title'))[:150],'fields',fields,'rows',len(table.get('data',[])))
                    print(name,'sample_security',json.dumps((table.get('data') or [[]])[0],ensure_ascii=False)[:700])
            except Exception as e:
              print(name,'PROBE_FAILED',type(e).__name__,str(e)[:250])
          PY
