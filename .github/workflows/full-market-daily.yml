name: Full Market Daily Data Rotation

on:
  schedule:
    # 22:00 Taiwan time, Monday-Friday. Each run refreshes a rotating batch.
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "每個市場本次更新檔數（1–250）"
        required: true
        type: number
        default: 5

permissions:
  contents: read

concurrency:
  group: full-market-daily-rotation
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: src
      BATCH_SIZE: ${{ inputs.batch_size || '5' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing GitHub Actions secret DATABASE_URL"
            exit 1
          fi

      - name: Install test runner
        run: pip install pytest

      - name: Run refresh helper tests
        env:
          PYTHONPATH: src
        run: pytest -q tests/test_full_market_refresh.py

      - name: Compile modules
        run: |
          python -m py_compile \
            src/full_market_refresh.py \
            src/stock_list.py \
            src/market_data.py \
            src/tpex_market_data.py \
            src/db_storage.py \
            src/adjusted_prices.py \
            src/build_adjusted_prices.py \
            src/calculate_technicals.py \
            src/calculate_smc.py

      - name: Refresh rotating market batches and recalculate indicators
        run: python src/full_market_refresh.py

      - name: Recalculate composite scores after market refresh
        run: python src/sync_composite_scores.py
