name: Official Currently Listed Only No-Delisted Research Universe (Read Only)

on:
  push:
    branches: [main]
    paths:
      - ".github/current-official-listed-only-20261122.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-official-only-source-audit-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  official-active-only:
    if: >-
      github.repository == 'jimmyj92096908-debug/tw-stock-ai' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PYTHONPATH: .:src
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify release marker
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            git diff --name-only --diff-filter=A HEAD^ HEAD |
              grep -Fxq ".github/current-official-listed-only-20261122.txt"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing free project dependencies
        run: python -m pip install -r requirements.txt
      - name: Test no-delisted rule across research ranking, training, forward freeze and daily research report
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          python -m py_compile src/current_official_listing.py scripts/current_listed_only_audit.py
          python -m unittest tests.test_current_listed_only tests.test_factor_model tests.test_factor_model_v2 tests.test_trained_factor_model tests.test_send_line_report_queries -v
      - name: Compare actual newest official exchange company list with current stock_master (read only)
        run: python scripts/current_listed_only_audit.py --report current-official-listed-only-proof.json
      - name: Preserve listing-only exclusion audit without altering old history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: currently-officially-listed-only-no-delisted-proof
          path: current-official-listed-only-proof.json
          retention-days: 14
          if-no-files-found: ignore
