name: Trained Factor Model Offline Acceptance

on:
  pull_request:
    paths:
      - "src/trained_factor_model.py"
      - "scripts/trained_factor_pipeline.py"
      - "tests/test_trained_factor_model.py"
      - ".github/workflows/trained-factor-model-tests.yml"
  push:
    branches:
      - "feature/complete-trained-model-*"
    paths:
      - "src/trained_factor_model.py"
      - "scripts/trained_factor_pipeline.py"
      - "tests/test_trained_factor_model.py"
      - ".github/workflows/trained-factor-model-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile model and command line tool
        run: |
          python -m py_compile src/trained_factor_model.py
          python -m py_compile scripts/trained_factor_pipeline.py
      - name: Test model training, data embargo, holdout, and saved artifact replay
        run: |
          python -m unittest \
            tests.test_factor_model \
            tests.test_factor_model_validation \
            tests.test_factor_model_v2 \
            tests.test_trained_factor_model -v
      - name: State offline verification boundary
        if: always()
        run: |
          {
            echo "### Trained Factor Model Acceptance"
            echo "- CI uses only synthetic and mocked input; no real Neon credentials."
            echo "- Production PostgreSQL, LINE messages and trade orders were never accessed."
            echo "- Research ranking always returns abstain=true and live_trading_approved=false."
            echo "- A passing CI does not establish positive holdout performance."
          } >> "$GITHUB_STEP_SUMMARY"
