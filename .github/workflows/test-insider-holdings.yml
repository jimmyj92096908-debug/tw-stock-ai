name: Test Insider Holdings Parser
on:
  push:
    paths:
      - "src/insider_holdings_data.py"
      - "tests/test_insider_holdings_data.py"
      - ".github/workflows/test-insider-holdings.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests "psycopg[binary]>=3.2,<4"
      - run: python -m py_compile src/insider_holdings_data.py
      - run: python -m unittest tests.test_insider_holdings_data -v
