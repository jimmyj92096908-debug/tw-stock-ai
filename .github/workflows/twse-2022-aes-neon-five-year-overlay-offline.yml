name: TWSE 2022 AES + Five-Year Neon Source Overlay (Offline)

on:
  pull_request:
    paths:
      - 'scripts/twse_2022_aes_neon_five_year_overlay_offline.py'
      - 'tests/test_twse_2022_aes_neon_five_year_overlay_offline.py'
      - '.github/workflows/twse-2022-aes-neon-five-year-overlay-offline.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/twse_2022_aes_neon_five_year_overlay_offline.py'
      - 'tests/test_twse_2022_aes_neon_five_year_overlay_offline.py'
      - '.github/workflows/twse-2022-aes-neon-five-year-overlay-offline.yml'

permissions:
  contents: read

jobs:
  exact-owner-receipt-source-day-union:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ''
      STOCK_ARCHIVE_KEY_HEX: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing free requirements
        run: python -m pip install -r requirements.txt
      - name: Test 2022 AES and Neon day overlay with no credentials
        run: |
          unset PYTHONPATH
          python -m py_compile scripts/twse_2022_aes_neon_five_year_overlay_offline.py
          python -m scripts.twse_2022_aes_neon_five_year_overlay_offline --help >/dev/null
          python -m unittest tests.test_twse_2022_aes_neon_five_year_overlay_offline -v
