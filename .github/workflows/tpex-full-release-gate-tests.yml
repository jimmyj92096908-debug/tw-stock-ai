name: Full TPEx Historical Research Release Guard

on:
  pull_request:
    paths:
      - 'scripts/twse_240_release_gate.py'
      - 'scripts/research_readonly_milestones.py'
      - '.github/workflows/twstock-data-quality-monitor.yml'
      - 'tests/test_twse_240_release_gate.py'
      - 'tests/test_research_readonly_milestones.py'
      - 'tests/test_tpex_full_release_gate_postgres.py'
      - 'tests/test_tpex_alternate_official_source_pg17.py'
      - '.github/workflows/tpex-full-release-gate-tests.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Verify historical source precedence over latest score completeness
        run: |
          python -m py_compile scripts/twse_240_release_gate.py scripts/research_readonly_milestones.py
          python -m unittest tests.test_twse_240_release_gate tests.test_research_readonly_milestones tests.test_tpex_stale_factor_refresh -v

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: stock_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d stock_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: .:src
      STOCK_CI_POSTGRES_URL: postgresql://test:test@127.0.0.1:5432/stock_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Prove stored latest score does not conceal newly appended older history
        run: python -m unittest tests.test_tpex_full_release_gate_postgres -v

  alternate-official-postgresql17:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: stock_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d stock_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: .:src
      STOCK_CI_POSTGRES_URL: postgresql://test:test@127.0.0.1:5432/stock_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Verify tradingStock-only official TPEx stock and independent EW session counter
        run: python -m unittest tests.test_tpex_alternate_official_source_pg17 -v
