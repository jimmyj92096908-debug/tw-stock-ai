name: Market Scope Evidence Audit

on:
  push:
    branches:
      - feature/five-year-bulk-history-downloader
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scope-audit unit tests
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -p "test_tpex_calendar_candidates.py" -v
          python -m unittest discover -s tests -p "test_tdcc_universe_candidates.py" -v
          python -m unittest discover -s tests -p "test_twse_current_list.py" -v
          python -m unittest discover -s tests -p "test_tpex_current_list.py" -v
          python -m unittest discover -s tests -p "test_current_market_universe_reconciliation.py" -v
          python -m unittest discover -s tests -p "test_instrument_classification_source_registry.py" -v
          python -m unittest discover -s tests -p "test_official_instrument_source_audit.py" -v
          python -m unittest discover -s tests -p "test_tpex_etf_infohub.py" -v
          python -m unittest discover -s tests -p "test_exact_instrument_exclusion_reconciliation.py" -v
          python -m unittest discover -s tests -p "test_security_lifecycle_candidates.py" -v
          python -m unittest discover -s tests -p "test_lifecycle_source_inventory.py" -v
          python -m unittest discover -s tests -p "test_tpex_openapi_catalog.py" -v\n          python -m unittest discover -s tests -p "test_tpex_bond_sources.py" -v
          python -m unittest discover -s tests -p "test_tpex_delisted_discovery.py" -v
      - name: Install audit dependencies
        run: python -m pip install requests pypdf
      - name: Run read-only official market scope audit
        env:
          PYTHONPATH: .
        run: |
          python scripts/audit_twse_current_list.py --output-dir audit-output/market-scope/twse-current
          python scripts/audit_tpex_current_list.py --output-dir audit-output/market-scope/tpex-current
          python scripts/audit_official_instrument_sources.py --output-dir audit-output/market-scope/instrument-sources
          python scripts/audit_tpex_etf_infohub.py --output-dir audit-output/market-scope/tpex-etf
          python scripts/audit_tpex_openapi_catalog.py --output-dir audit-output/market-scope/tpex-openapi\n          python scripts/audit_tpex_bond_sources.py --output-dir audit-output/market-scope/tpex-bonds
          python scripts/audit_market_scope.py \
            --registry data/calendars/source_registry.json \
            --output-dir audit-output/market-scope \
            --report audit-output/market-scope/market-scope-audit.json
          python scripts/parse_tpex_calendar_candidates.py --input-dir audit-output/market-scope/tpex-calendar --output audit-output/market-scope/tpex-calendar-candidates.json
          python scripts/analyze_tdcc_universe_candidates.py \
            --input audit-output/market-scope/tdcc-securities-master.csv \
            --output audit-output/market-scope/tdcc-universe-candidates.json \
            --candidates-csv audit-output/market-scope/tdcc-current-listed-otc-candidates.csv
          python scripts/reconcile_current_market_universe.py \
            --twse-csv audit-output/market-scope/twse-current/twse-current-listed-candidates.csv \
            --tpex-csv audit-output/market-scope/tpex-current/tpex-current-otc-candidates.csv \
            --tdcc-master-csv audit-output/market-scope/tdcc-securities-master.csv \
            --tdcc-active-candidates-csv audit-output/market-scope/tdcc-current-listed-otc-candidates.csv \
            --twse-audit-json audit-output/market-scope/twse-current/twse-current-listed-audit.json \
            --tpex-audit-json audit-output/market-scope/tpex-current/tpex-current-otc-audit.json \
            --output-dir audit-output/market-scope/reconciliation
          python scripts/reconcile_exact_instrument_exclusions.py \
            --audit-root audit-output/market-scope \\
            --reconciliation-json audit-output/market-scope/reconciliation/current-market-universe-reconciliation.json \
            --output-dir audit-output/market-scope/exact-exclusions
      - name: Upload raw official sources and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-scope-evidence-audit
          path: audit-output/market-scope/
          if-no-files-found: warn
          retention-days: 30
