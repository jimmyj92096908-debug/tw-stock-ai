name: Market Scope Evidence Audit

on:
  push:
    branches:
      - feature/five-year-bulk-history-downloader
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: python -m pip install requests pypdf
      - name: Run read-only official market scope audit
        env:
          PYTHONPATH: .
        run: |
          python scripts/audit_market_scope.py \
            --registry data/calendars/source_registry.json \
            --output-dir audit-output/market-scope \
            --report audit-output/market-scope/market-scope-audit.json
          python scripts/parse_tpex_calendar_candidates.py \\
            --input-dir audit-output/market-scope/tpex-calendar \\
            --output audit-output/market-scope/tpex-calendar-candidates.json
      - name: Upload raw official sources and audit report
        uses: actions/upload-artifact@v4
        with:
          name: market-scope-evidence-audit
          path: audit-output/market-scope/
          if-no-files-found: error
          retention-days: 30
