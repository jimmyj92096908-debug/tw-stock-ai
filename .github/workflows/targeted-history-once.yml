name: One-Time Authorized 2330 and 6488 Historical Catch-up
on:
  push:
    branches: ["feature/line-stock-code-analysis"]
    paths:
      - ".github/workflows/targeted-history-once.yml"
permissions:
  contents: read
concurrency:
  group: targeted-history-2330-6488-20261120
  cancel-in-progress: false
jobs:
  catch-up:
    if: github.repository == 'jimmyj92096908-debug/tw-stock-ai' && github.ref == 'refs/heads/feature/line-stock-code-analysis'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests and syntax checks
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Missing DATABASE_URL"; exit 1; fi
          python -m unittest tests.test_targeted_history_refresh tests.test_full_market_refresh -v
          python -m py_compile src/targeted_history_refresh.py src/full_market_refresh.py
      - name: Display only bounded month windows without writing
        run: python src/targeted_history_refresh.py
      - name: Update official months for only 2330 and 6488, then rebuild derived indicators
        env:
          STOCK_HISTORY_WRITE_ENABLED: "yes"
        run: python src/targeted_history_refresh.py --apply
