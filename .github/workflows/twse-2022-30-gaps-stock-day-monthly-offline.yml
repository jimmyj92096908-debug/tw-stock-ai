name: TWSE 2022 30 Gap Official STOCK_DAY Month Audit (Offline)

on:
  pull_request:
    paths:
      - 'scripts/twse_2022_30_gap_official_stock_day_monthly_readonly.py'
      - 'tests/test_twse_2022_30_gap_official_stock_day_monthly_readonly.py'
      - '.github/workflows/twse-2022-30-gaps-stock-day-monthly-offline.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/twse_2022_30_gap_official_stock_day_monthly_readonly.py'
      - 'tests/test_twse_2022_30_gap_official_stock_day_monthly_readonly.py'
      - '.github/workflows/twse-2022-30-gaps-stock-day-monthly-offline.yml'

permissions:
  contents: read

jobs:
  official-monthly-source-proof-no-imputed-price:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ''
      STOCK_ARCHIVE_KEY_HEX: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing free dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline synthetic official monthly stock-day response tests
        run: |
          unset PYTHONPATH
          python -m py_compile scripts/twse_2022_30_gap_official_stock_day_monthly_readonly.py
          python -m unittest tests.test_twse_2022_30_gap_official_stock_day_monthly_readonly -v
