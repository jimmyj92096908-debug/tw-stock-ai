name: Taiwan Market Data Quality Audit

on:
  workflow_dispatch:
  schedule:
    # 17:00 UTC weekdays (01:00 Taiwan time)
    - cron: "0 17 * * 1-5"

permissions:
  contents: read

concurrency:
  group: market-data-quality-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing DATABASE_URL secret"
            exit 1
          fi
      - name: Test audit calculations
        run: |
          pip install pytest
          pytest -q tests/test_data_quality_audit.py
      - name: Run read-only audit
        run: python src/data_quality_audit.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: market-data-quality-report
          path: data/quality/data_quality_report.json
          if-no-files-found: error
