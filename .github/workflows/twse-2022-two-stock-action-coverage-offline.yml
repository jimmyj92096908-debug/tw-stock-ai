name: TWSE 2022 Two-Stock Other Actions Audit (Offline Tests)

on:
  pull_request:
    paths:
      - 'scripts/twse_2022_two_stock_action_coverage_readonly.py'
      - 'tests/test_twse_2022_two_stock_action_coverage_readonly.py'
      - '.github/workflows/twse-2022-two-stock-action-coverage-offline.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/twse_2022_two_stock_action_coverage_readonly.py'
      - 'tests/test_twse_2022_two_stock_action_coverage_readonly.py'
      - '.github/workflows/twse-2022-two-stock-action-coverage-offline.yml'

permissions:
  contents: read

jobs:
  test-stored-actions-not-complete-return:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ''
      STOCK_ARCHIVE_KEY_HEX: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Run synthetic no-Neon no-keys event audit tests
        run: |
          unset PYTHONPATH
          python -m py_compile scripts/twse_2022_two_stock_action_coverage_readonly.py
          python -m scripts.twse_2022_two_stock_action_coverage_readonly --help >/dev/null
          python -m unittest tests.test_twse_2022_two_stock_action_coverage_readonly -v
