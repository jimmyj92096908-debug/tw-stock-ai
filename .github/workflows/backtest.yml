name: Taiwan Stock Historical Backtest
on:
  workflow_dispatch:
  push:
    paths:
      - "src/backtest_engine.py"
      - "sql/backtest_schema.sql"
      - "tests/test_backtest_engine.py"
      - ".github/workflows/backtest.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests "psycopg[binary]>=3.2,<4"
      - run: python -m unittest tests.test_backtest_engine -v
      - run: python -m py_compile src/backtest_engine.py
  backtest:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests "psycopg[binary]>=3.2,<4"
      - name: Validate database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::DATABASE_URL missing"; exit 1; fi
      - name: Apply schema and run backtest
        run: |
          python - <<'PY'
          import os,sys,psycopg
          sys.path.insert(0,"src")
          from tdcc_data import normalize_database_url
          with psycopg.connect(normalize_database_url(os.environ["DATABASE_URL"])) as conn:
              with conn.cursor() as cur:
                  cur.execute(open("sql/backtest_schema.sql",encoding="utf-8").read())
          PY
          echo "Running development period (2021-2024)"
          BACKTEST_LABEL=development BACKTEST_START_DATE=2021-01-01 BACKTEST_END_DATE=2024-12-31 python src/backtest_engine.py
          echo "Running out-of-sample period (2025-current)"
          BACKTEST_LABEL=out_of_sample BACKTEST_START_DATE=2025-01-01 BACKTEST_END_DATE=2026-12-31 python src/backtest_engine.py
