name: Taiwan Stock Historical Backtest
on:
  workflow_dispatch:
  push:
    paths:
      - "src/backtest_engine.py"
      - "sql/backtest_schema.sql"
      - "tests/test_backtest_engine.py"
      - "src/market_benchmark.py"
      - "src/benchmark_analysis.py"
      - "src/regime_classifier.py"
      - "src/entry_threshold_research.py"
      - "sql/benchmark_schema.sql"
      - "tests/test_market_benchmark.py"
      - ".github/workflows/backtest.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests "psycopg[binary]>=3.2,<4"
      - run: python -m unittest tests.test_backtest_engine tests.test_market_benchmark tests.test_benchmark_analysis -v
      - run: python -m py_compile src/backtest_engine.py src/market_benchmark.py src/benchmark_analysis.py src/regime_classifier.py src/entry_threshold_research.py tests/test_benchmark_analysis.py
  backtest:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests "psycopg[binary]>=3.2,<4"
      - name: Validate database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::DATABASE_URL missing"; exit 1; fi
      - name: Development-only entry threshold sensitivity
        run: python src/entry_threshold_research.py
      - name: Apply schema and run backtest
        run: |
          python - <<'PY'
          import os,sys,psycopg
          sys.path.insert(0,"src")
          from tdcc_data import normalize_database_url
          with psycopg.connect(normalize_database_url(os.environ["DATABASE_URL"])) as conn:
              with conn.cursor() as cur:
                  cur.execute(open("sql/backtest_schema.sql",encoding="utf-8").read())
                  cur.execute(open("sql/benchmark_schema.sql",encoding="utf-8").read())
          PY
          echo "Importing official TAIEX history (2021-current)"
          python src/market_benchmark.py
          echo "Revalidation after corporate-action adjustment rebuild"
          echo "Running development period (2021-2024)"
          BACKTEST_LABEL=development BACKTEST_ENTRY_SCORE=60 BACKTEST_START_DATE=2021-01-01 BACKTEST_END_DATE=2024-12-31 python src/backtest_engine.py
          BACKTEST_LABEL=development python src/benchmark_analysis.py
          echo "Running out-of-sample period (2025-current)"
          BACKTEST_LABEL=out_of_sample BACKTEST_ENTRY_SCORE=60 BACKTEST_START_DATE=2025-01-01 BACKTEST_END_DATE=2026-12-31 python src/backtest_engine.py
          BACKTEST_LABEL=out_of_sample python src/benchmark_analysis.py
          echo "Running out-of-sample comparison at candidate threshold 75"
          BACKTEST_LABEL=out_of_sample BACKTEST_ENTRY_SCORE=75 BACKTEST_START_DATE=2025-01-01 BACKTEST_END_DATE=2026-12-31 python src/backtest_engine.py
          BACKTEST_LABEL=out_of_sample python src/benchmark_analysis.py
          echo "ATR sensitivity: 2.5x, out-of-sample"
          BACKTEST_LABEL=out_of_sample_atr_2_5 BACKTEST_ENTRY_SCORE=60 BACKTEST_ATR_MULTIPLE=2.5 BACKTEST_START_DATE=2025-01-01 BACKTEST_END_DATE=2026-12-31 python src/backtest_engine.py
          BACKTEST_LABEL=out_of_sample_atr_2_5 python src/benchmark_analysis.py
          echo "ATR sensitivity: 3.0x, out-of-sample"
          BACKTEST_LABEL=out_of_sample_atr_3_0 BACKTEST_ENTRY_SCORE=60 BACKTEST_ATR_MULTIPLE=3.0 BACKTEST_START_DATE=2025-01-01 BACKTEST_END_DATE=2026-12-31 python src/backtest_engine.py
          BACKTEST_LABEL=out_of_sample_atr_3_0 python src/benchmark_analysis.py

          echo "Development-only adaptive regime test: BEAR 60, BULL/SIDEWAYS 70"
          BACKTEST_LABEL=development_regime_adaptive BACKTEST_ENTRY_SCORE=60 BACKTEST_REGIME_ENTRY_SCORES='{"BEAR":60,"BULL":70,"SIDEWAYS":70,"UNKNOWN":999}' BACKTEST_START_DATE=2021-01-01 BACKTEST_END_DATE=2024-12-31 python src/backtest_engine.py
          BACKTEST_LABEL=development_regime_adaptive python src/benchmark_analysis.py
          echo "Out-of-sample adaptive regime validation"
          BACKTEST_LABEL=out_of_sample_regime_adaptive BACKTEST_ENTRY_SCORE=60 BACKTEST_REGIME_ENTRY_SCORES='{"BEAR":60,"BULL":70,"SIDEWAYS":70,"UNKNOWN":999}' BACKTEST_START_DATE=2025-01-01 BACKTEST_END_DATE=2026-12-31 python src/backtest_engine.py
          BACKTEST_LABEL=out_of_sample_regime_adaptive python src/benchmark_analysis.py
