name: Owner Dual Track Readiness (Offline)
on:
  pull_request:
    paths:
      - 'scripts/owner_dual_track_readiness_readonly.py'
      - 'tests/test_owner_dual_track_readiness_readonly.py'
      - '.github/workflows/owner-dual-track-readiness-offline.yml'
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v tests.test_owner_dual_track_readiness_readonly
