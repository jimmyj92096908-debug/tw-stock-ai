name: Owner Known Action Event Sensitivity (Offline)
on:
  pull_request:
    paths:
      - 'scripts/owner_known_action_event_sensitivity_offline.py'
      - 'tests/test_owner_known_action_event_sensitivity_offline.py'
      - '.github/workflows/owner-known-action-event-sensitivity-offline.yml'
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v tests.test_owner_known_action_event_sensitivity_offline
