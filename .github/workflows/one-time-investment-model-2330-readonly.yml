name: One-Time Investment Model 2330 Neon Read-Only Acceptance

on:
  push:
    branches: [feature/complete-investment-model-research-bundle-20261121]
    paths:
      - ".github/workflows/one-time-investment-model-2330-readonly.yml"

permissions:
  contents: read

jobs:
  model-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: src
      INVESTMENT_MODEL_READONLY: "yes"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model dependencies
        run: pip install -r requirements.txt
      - name: Live Neon research model and 2330 as-of verification (server-enforced read only)
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::DATABASE_URL secret unavailable"; exit 1; fi
          python scripts/investment_model_pipeline.py --live-readonly --market twse --stock-id 2330 --limit 10 --output /tmp/model-2330.json
      - name: Report only verifiable aggregate stock research data and block orders
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("/tmp/model-2330.json").read_text())
          x=s["stock_data"]
          assert s["data_mode"]=="existing_neon_snapshot_read_only"
          assert s["abstain_from_trading"] is True
          assert s["publish_line_trade_signal"] is False
          assert s["orders_enabled"] is False
          assert s["production_database_modified"] is False
          assert s["model"]["research_evidence_status"]=="INCOMPLETE_OR_FAILED"
          assert x["market"]=="twse" and x["stock_id"]=="2330"
          assert x["price_date"] is not None
          print("MODEL_LIVE_READONLY_APPROVED_FOR_RESEARCH stock=twse/2330 price_date=%s technical_date=%s composite_date=%s separate_chip_date=%s separate_chip_score=%s coverage=%s historical_rank_date=%s eligible_ranked=%s future_chip_borrowed=false abstain=true" % (
            x["price_date"],x["technical_date"],x["composite_date"],
            x["independent_chip_date"],x["independent_chip_score"],
            x["independent_chip_coverage"],s["ranking"].get("date"),
            s["ranking"].get("eligible_universe",0)
          ))
          PY
      - name: Keep only public aggregate research artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-2330-research-readonly
          path: /tmp/model-2330.json
          retention-days: 7
