name: Verified History Indicator Catch-Up

on:
  # Proposed WRITE-enabled independent cron; NOT active until separately
  # reviewed and merged. It processes one bounded 20/market batch per run.
  # 03:10 Asia/Taipei Tue-Sat, after official 01:50 dated history.
  schedule:
    - cron: "10 19 * * 1-5"
  workflow_dispatch:
    inputs:
      apply:
        description: "手動是否補計技術／SMC 指標？預設只預覽"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: twstock-indicator-catchup
  cancel-in-progress: false

jobs:
  indicators:
    if: >-
      github.repository == 'jimmyj92096908-debug/tw-stock-ai' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'schedule'
        ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify 60-session history threshold, bounded batch and secrecy
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Missing DATABASE_URL"; exit 1; fi
          python -m py_compile src/batch_indicator_catchup.py
          python -m unittest tests.test_batch_indicator_catchup -v
      - name: Inspect candidate cohort and baseline in single READ ONLY transaction
        run: python scripts/indicator_schedule_probe.py --output indicator-before.json
      - name: Preview eligible stocks without writes
        run: python src/batch_indicator_catchup.py --per-market 20
      - name: Explain action mode
        run: |
          echo "### Indicator Catch-Up (reviewed write schedule)" >> "$GITHUB_STEP_SUMMARY"
          echo "- A bounded apply runs ONLY for an approved scheduled or manually opted-in invocation." >> "$GITHUB_STEP_SUMMARY"
          echo "- Manual dispatch with apply=false is strictly preview-only." >> "$GITHUB_STEP_SUMMARY"
          echo "- 20 eligible stocks per market, >=60 real-price sessions; stock transactions use SAVEPOINT." >> "$GITHUB_STEP_SUMMARY"
          echo "- Main + repository guard, no LINE sends or price fabrication." >> "$GITHUB_STEP_SUMMARY"
      - name: Compute verified adjusted prices, technical and SMC
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.apply == true)
        env:
          STOCK_INDICATOR_CATCHUP_WRITE_ENABLED: "yes"
        run: python src/batch_indicator_catchup.py --apply --per-market 20
      - name: Inspect post-run backlog in READ ONLY transaction
        if: >-
          always() &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && inputs.apply == true))
        run: python scripts/indicator_schedule_probe.py --output indicator-after.json
      - name: Confirm actual coverage progressed before permitting successful downstream score refresh
        if: >-
          success() &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && inputs.apply == true))
        run: |
          python scripts/indicator_batch_reconcile.py \
            --before indicator-before.json \
            --after indicator-after.json \
            --output indicator-progress-proof.json
      - name: Retain aggregate before/after evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indicator-bounded-catchup-evidence
          path: |
            indicator-before.json
            indicator-after.json
            indicator-progress-proof.json
          if-no-files-found: ignore
          retention-days: 14
