name: Official Raw Source Capture and Reconciliation

on:
  push:
    branches:
      - feature/official-raw-source-reconciliation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-raw-source-reconciliation-v2
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP dependency
        run: python -m pip install "requests>=2.31,<3"
      - name: Run unit tests
        run: python -m unittest tests.test_official_raw_capture tests.test_official_source_reconciliation -v
      - name: Capture official raw responses
        run: python -m scripts.capture_official_raw_sources
      - name: Upload raw payloads and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-raw-source-reconciliation
          path: artifacts/official-raw-source/
          if-no-files-found: warn
          retention-days: 14
