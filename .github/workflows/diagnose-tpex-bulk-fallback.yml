name: Diagnose TPEx official bulk OHLC fallback

on:
  push:
    branches:
      - feature/ohlc-quality-classification
    paths:
      - "scripts/diagnose_tpex_bulk_fallback.py"
      - ".github/workflows/diagnose-tpex-bulk-fallback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests
      - name: Test CSV parser
        run: python -m unittest tests.test_tpex_bulk_fallback -v
      - name: Probe official dated bulk endpoint (read only)
        run: python scripts/diagnose_tpex_bulk_fallback.py
      - name: Discover public daily close history request (read only)
        run: python scripts/discover_tpex_mi_pricing_request.py
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: tpex-bulk-fallback-diagnostic
          path: |\n            artifacts/tpex-bulk-fallback/\n            artifacts/tpex-mi-pricing-discovery/\n          if-no-files-found: error
          retention-days: 14
