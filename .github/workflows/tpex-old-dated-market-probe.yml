name: TPEx Read-Only 2025 and 2022 Historical Market-Dated Provenance Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/tpex-old-dated-market-readonly-probe-20261121.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twstock-tpex-old-dated-market-readonly-probe
  cancel-in-progress: false

jobs:
  verify-old-market-source:
    if: >-
      github.repository == 'jimmyj92096908-debug/tw-stock-ai' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check new exact one-shot proof marker
        id: marker
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] &&
             git diff --name-only --diff-filter=A HEAD^ HEAD | grep -Fxq ".github/tpex-old-dated-market-readonly-probe-20261121.txt"; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing free dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify real source close matching and zero write guarantees
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          python -m py_compile scripts/tpex_old_dated_market_source_probe.py
          python -m unittest tests.test_tpex_old_dated_market_source_probe tests.test_tpex_dated_history tests.test_tpex_dated_bulk_canary -v
      - name: Cross-check two actual old TPEx dated market responses READ ONLY
        if: github.event_name == 'workflow_dispatch' || steps.marker.outputs.new == 'true'
        run: python scripts/tpex_old_dated_market_source_probe.py --report tpex-old-dated-market-source-proof.json
      - name: Preserve aggregate old-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpex-old-dated-market-source-proof
          path: tpex-old-dated-market-source-proof.json
          retention-days: 14
          if-no-files-found: ignore
