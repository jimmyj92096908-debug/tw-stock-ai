name: Owner Raw Price Ridge Diagnostic (Offline)
on:
  pull_request:
    paths:
      - 'scripts/owner_raw_price_ridge_diagnostic_offline.py'
      - 'tests/test_owner_raw_price_ridge_diagnostic_offline.py'
      - '.github/workflows/owner-raw-price-ridge-diagnostic-offline.yml'
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt numpy
      - run: python -m unittest -v tests.test_owner_raw_price_ridge_diagnostic_offline
