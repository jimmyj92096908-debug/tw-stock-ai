name: TWSE 2022 All 30 Long Source Gap Official Halt Queue (Offline)

on:
  pull_request:
    paths:
      - 'scripts/twse_2022_116_internal_source_absence_triage.py'
      - 'scripts/twse_2022_aes_neon_eligible_density_readonly.py'
      - 'tests/test_twse_2022_30_long_source_gap_queue.py'
      - '.github/workflows/twse-2022-all30-long-source-gap-offline.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/twse_2022_116_internal_source_absence_triage.py'
      - 'scripts/twse_2022_aes_neon_eligible_density_readonly.py'
      - 'tests/test_twse_2022_30_long_source_gap_queue.py'
      - '.github/workflows/twse-2022-all30-long-source-gap-offline.yml'

permissions:
  contents: read

jobs:
  complete30-immutable116-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ''
      STOCK_ARCHIVE_KEY_HEX: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing free dependencies
        run: python -m pip install -r requirements.txt
      - name: Test complete long absence runs and prior proof no stock/price leak
        run: |
          unset PYTHONPATH
          python -m py_compile scripts/twse_2022_116_internal_source_absence_triage.py scripts/twse_2022_aes_neon_eligible_density_readonly.py
          python -m unittest tests.test_twse_2022_30_long_source_gap_queue -v
          python -m unittest tests.test_twse_2022_116_internal_source_absence_triage -v
