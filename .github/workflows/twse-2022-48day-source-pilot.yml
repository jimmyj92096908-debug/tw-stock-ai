name: TWSE 2022 48-Day Source Replay (Real No Storage)

on:
  pull_request:
    paths:
      - 'scripts/twse_2022_48day_real_source_pilot.py'
      - 'tests/test_twse_2022_48day_real_source_pilot.py'
      - '.github/workflows/twse-2022-48day-source-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/twse_2022_48day_real_source_pilot.py'
      - '.github/workflows/twse-2022-48day-source-pilot.yml'

permissions:
  contents: read

concurrency:
  group: twse-2022-forty-eight-official-source-ram-only
  cancel-in-progress: false

jobs:
  offline-source-and-budget-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing free Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Test exact 2022 holiday calendar, request cap, source errors
        run: |
          python -m py_compile scripts/twse_2022_48day_real_source_pilot.py
          python -m unittest -v tests.test_twse_2022_48day_real_source_pilot

  official-forty-eight-readonly:
    needs: offline-source-and-budget-contract
    if: >-
      github.repository == 'jimmyj92096908-debug/tw-stock-ai' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PYTHONPATH: .:src
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free standard-runner dependencies
        run: python -m pip install -r requirements.txt
      - name: Replay exactly 48 old shared official dates with 4-second spacing
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          python scripts/twse_2022_48day_real_source_pilot.py \
            --output twse-2022-48-source-aggregate.json
      - name: Only aggregate proof, blocked live model, no Neon writes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('twse-2022-48-source-aggregate.json')
          d=json.loads(p.read_text())
          assert p.stat().st_size<8192
          assert d['scope']=='TWSE_2022_48_REAL_MARKET_DAYS_SHARED_MEMORY_ONLY'
          assert d['authentic_source_days_evaluated']==48
          assert d['actual_official_http_requests']==48
          assert d['maximum_official_http_requests']==48
          assert d['minimum_request_interval_seconds']>=4
          assert d['first_source_date']=='2022-01-04'
          assert d['last_source_date']=='2022-03-22'
          assert d['lunar_new_year_official_nontrading_gap_excluded']
          assert d['complete_common_stock_cohort']>=500
          assert min(d['daily_current_eligible_source_bar_counts'])>=500
          assert d['stock_ma240_passes']==0
          assert d['no_240_session_real_market_factor_claim']
          assert not d['full_five_year_market_history_complete']
          assert not d['survivorship_free_historical_universe_verified']
          assert d['raw_price_or_factor_rows_persisted']==0
          assert d['neon_rows_written']==0
          assert d['line_messages_sent']==0
          assert not d['live_trading_approved']
          assert not d['paid_upgrade_requested']
          # Logs contain only non-identifying date/count/summary evidence.
          print(json.dumps(d,ensure_ascii=False,sort_keys=True))
          PY
      # Deliberately NO upload-artifact: no market price or artifact storage cost.
