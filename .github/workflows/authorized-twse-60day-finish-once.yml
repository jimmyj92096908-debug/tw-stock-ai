# Single-use, owner-authorized step across the 60 verified-session threshold.
# Remove after success or failure.
name: Authorized TWSE 60-Day Indicator Completion (One Shot)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/authorized-twse-60day-finish-once.yml
permissions:
  contents: read
concurrency:
  group: twstock-twse-bulk-backfill
  cancel-in-progress: false
jobs:
  finish:
    if: github.repository == 'jimmyj92096908-debug/tw-stock-ai' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project requirements
        run: pip install -r requirements.txt
      - name: Validate guarded source and indicator logic BEFORE production writes
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::DATABASE_URL missing"; exit 1; fi
          python -m unittest tests.test_twse_dated_history tests.test_official_market_feed tests.test_batch_indicator_catchup -v
          python -m py_compile src/twse_dated_history.py src/batch_indicator_catchup.py
      - name: Preview one official older date WITHOUT writing
        run: python src/twse_dated_history.py --batch-days 1 --lookback-days 366
      - name: Add at most eight further verified official TWSE historical sessions
        env:
          STOCK_TWSE_HISTORY_WRITE_ENABLED: "yes"
        run: python src/twse_dated_history.py --apply --batch-days 8 --lookback-days 366
      - name: Confirm 60-session eligibility before technical computation
        run: |
          python - <<'PY'
          import os,psycopg
          with psycopg.connect(os.environ['DATABASE_URL']) as conn:
              with conn.cursor() as cur:
                  cur.execute("""SELECT COUNT(*) FROM (
                      SELECT market,stock_id FROM public.daily_prices
                      WHERE close IS NOT NULL AND market='twse' AND stock_id<>'1808'
                      GROUP BY market,stock_id HAVING COUNT(*)>=60
                  ) AS qualified""")
                  eligible=cur.fetchone()[0]
          print(f"Eligible stocks with >=60 verified sessions: {eligible}")
          if eligible<900: raise SystemExit("Insufficient verified history; refusing to calculate indicators")
          PY
      - name: Build adjusted, technical and SMC data for first 20 qualified TWSE stocks
        env:
          STOCK_INDICATOR_CATCHUP_WRITE_ENABLED: "yes"
        run: python src/batch_indicator_catchup.py --apply --per-market 20
      - name: Build composite scores using verified same-day price and indicators
        run: python scripts/score_after_refresh.py
      - name: Final read-only integrity check
        run: |
          python - <<'PY'
          import os,psycopg
          with psycopg.connect(os.environ['DATABASE_URL']) as conn:
              with conn.cursor() as cur:
                  cur.execute("""SELECT
                    (SELECT COUNT(*)::int FROM public.daily_prices) AS price_rows,
                    (SELECT COUNT(DISTINCT (market,stock_id))::int FROM public.daily_technicals) AS technical_stocks,
                    (SELECT COUNT(DISTINCT (market,stock_id))::int FROM public.daily_smc) AS smc_stocks,
                    (SELECT COUNT(DISTINCT (market,stock_id))::int FROM public.daily_composite_scores WHERE total_score IS NOT NULL) AS scored_stocks""")
                  prices, technical, smc, scored=cur.fetchone()
          print(f"Verified prices={prices}, technical={technical}, smc={smc}, scored={scored}")
          if prices<114000 or technical<60 or smc<60 or scored<60:
              raise SystemExit("Verified analytical coverage not yet achieved")
          PY
