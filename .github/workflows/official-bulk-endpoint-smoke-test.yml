name: Official Bulk Endpoint Smoke Test

on:
  push:
    branches:
      - feature/five-year-bulk-history-downloader
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP dependency
        run: python -m pip install requests
      - name: Query one known trading date from each official endpoint
        env:
          PYTHONPATH: .
        run: |
          python scripts/smoke_test_official_bulk_endpoints.py --date 2026-11-19
