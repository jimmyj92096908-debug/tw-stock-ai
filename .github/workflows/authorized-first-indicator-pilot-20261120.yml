name: Authorized First Indicator Pilot 2026-11-20

# Temporary, single-use production pilot: PR review never writes.
# Main-branch squash commit must contain the unique activation marker below.
on:
  pull_request:
    paths:
      - ".github/workflows/authorized-first-indicator-pilot-20261120.yml"
      - "tests/test_authorized_first_indicator_pilot.py"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/authorized-first-indicator-pilot-20261120.yml"

permissions:
  contents: read

# Share lock with the activated nightly workflow to avoid concurrent writes.
concurrency:
  group: twstock-indicator-catchup
  cancel-in-progress: false

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline test dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify this one-shot pilot cannot run on a PR or a rerun
        run: |
          python -m py_compile scripts/indicator_schedule_probe.py scripts/indicator_batch_reconcile.py
          python -m unittest tests.test_authorized_first_indicator_pilot tests.test_batch_indicator_catchup tests.test_indicator_batch_reconcile -v

  real-first-batch:
    needs: offline-contract
    # This event can happen only after an explicitly reviewed and merged PR.
    # Run attempts >1 must not repeat real writes.
    if: >-
      github.repository == 'jimmyj92096908-debug/tw-stock-ai' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      github.run_attempt == 1 &&
      contains(github.event.head_commit.message, 'ACTIVATE-ONE-TIME-20261120-STOCK-PILOT')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install verified indicator pipeline
        run: python -m pip install -r requirements.txt
      - name: Require existing protected Neon credential
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL unavailable; abort, do not fabricate successful writes."
            exit 1
          fi
      - name: Record real preflight from a READ ONLY database snapshot
        run: python scripts/indicator_schedule_probe.py --output indicator-before.json
      - name: Preview at most two real candidates per market without writing
        run: python src/batch_indicator_catchup.py --per-market 2
      - name: Apply owner-authorized two-stock-per-market production pilot
        env:
          STOCK_INDICATOR_CATCHUP_WRITE_ENABLED: "yes"
        run: python src/batch_indicator_catchup.py --apply --per-market 2
      - name: Record real postflight from a READ ONLY database snapshot
        if: always()
        run: python scripts/indicator_schedule_probe.py --output indicator-after.json
      - name: Assert actual pending indicator coverage dropped
        if: success()
        run: |
          python scripts/indicator_batch_reconcile.py \
            --before indicator-before.json \
            --after indicator-after.json \
            --output indicator-progress-proof.json
      - name: Retain complete aggregate evidence even when a pilot fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authorized-first-indicator-pilot-evidence
          path: |
            indicator-before.json
            indicator-after.json
            indicator-progress-proof.json
          if-no-files-found: ignore
          retention-days: 30
      - name: State precise outcome boundary
        if: always()
        run: |
          {
            echo "### Owner-authorized first real indicator pilot"
            echo "- Enabled by one-time reviewed main merge marker, only on first run attempt."
            echo "- At most 2 TWSE and 2 TPEx symbols; guarded savepoints."
            echo "- Each write is adjusted, technical and SMC only; no LINE or trade signals."
            echo "- Check before/after artifact; no claims of progress without reconciliation."
            echo "- Normal recurring schedule remains separately limited to 20 per market."
          } >> "$GITHUB_STEP_SUMMARY"
