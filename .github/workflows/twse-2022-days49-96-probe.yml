name: TWSE 2022 Official Days 49-96 (RAM Only, 4s Pacing)

on:
  pull_request:
    paths:
      - 'scripts/twse_2022_days49_96_source_probe.py'
      - 'tests/test_twse_2022_days49_96_source_probe.py'
      - '.github/workflows/twse-2022-days49-96-probe.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/twse_2022_days49_96_source_probe.py'
      - '.github/workflows/twse-2022-days49-96-probe.yml'

permissions:
  contents: read

concurrency:
  group: twse-2022-second-48-session-official-source
  cancel-in-progress: false

jobs:
  offline-immutability-and-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Validate fixed calendar, holiday closures, failures, 4s pacing
        run: |
          python -m py_compile scripts/twse_2022_days49_96_source_probe.py
          python -m unittest -v tests.test_twse_2022_days49_96_source_probe

  real-official-second-batch:
    needs: offline-immutability-and-budget
    if: >-
      github.repository == 'jimmyj92096908-debug/tw-stock-ai' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PYTHONPATH: .:src
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Probe 48 real official days Mar 23-Jun 1 without Neon price writes
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          python scripts/twse_2022_days49_96_source_probe.py \
            --output twse-next48-aggregate.json
      - name: Audit the historical-source proof and no model promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path('twse-next48-aggregate.json')
          d=json.loads(f.read_text())
          assert f.stat().st_size < 8192
          assert d['authentic_source_days_evaluated']==48
          assert d['source_session_ordinal_start']==49
          assert d['source_session_ordinal_end']==96
          assert d['first_source_date']=='2022-03-23'
          assert d['last_source_date']=='2022-06-01'
          assert d['actual_official_http_requests']==48
          assert d['maximum_official_http_requests']==48
          assert d['minimum_request_interval_seconds']==4.0
          assert d['complete_common_stock_cohort']>=500
          assert d['stock_ma240_passes']==0
          assert not d['real_2022_240_day_ma_verified']
          assert not d['survivorship_free_historical_universe_verified']
          assert d['raw_price_or_factor_rows_persisted']==0
          assert d['neon_rows_written']==0
          assert d['line_messages_sent']==0
          assert not d['live_trading_approved']
          print(json.dumps(d,ensure_ascii=False,sort_keys=True))
          PY
      # Aggregate logs only, never raw-price artifacts or schedule.
