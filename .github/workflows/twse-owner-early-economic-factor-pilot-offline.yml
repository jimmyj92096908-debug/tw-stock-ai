name: Owner Early Economic Factor Pilot (Offline)
on:
  pull_request:
    paths:
      - 'scripts/twse_owner_early_economic_factor_pilot_readonly.py'
      - 'tests/test_twse_owner_early_economic_factor_pilot_readonly.py'
      - '.github/workflows/twse-owner-early-economic-factor-pilot-offline.yml'
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ".:src"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v tests.test_twse_owner_early_economic_factor_pilot_readonly
