name: One-Time TWSE Official Long-History 240-Session Research Catch-Up

on:
  schedule:
    # Independent root: 17:30 Asia/Taipei daily; never 4th workflow_run.
    - cron: '30 9 * * *'
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        required: true
        default: false
        description: 'Explicitly source-verify and append up to 112 older TWSE dates? Default preview.'

permissions:
  contents: read

# Same lock as the existing official dated TWSE schedule; no competing importer.
concurrency:
  group: twstock-dated-twse-history
  cancel-in-progress: false

jobs:
  long-history:
    if: >-
      github.repository == 'jimmyj92096908-debug/tw-stock-ai' &&
      (
        (github.event_name == 'schedule' && github.ref == 'refs/heads/main')
        ||
        (github.event_name == 'workflow_dispatch' &&
         github.ref == 'refs/heads/main' && inputs.apply == true)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      PYTHONPATH: .:src
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Use preexisting free Python dependencies
        run: pip install -r requirements.txt
      - name: Read-only prerequisites from completed TPEx source and derived units
        id: gate
        run: python scripts/twse_240_release_gate.py --mode source
      - name: Verify official TWSE date/coverage parsing and fail-closed batch rules
        if: steps.gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          python -m py_compile src/twse_dated_history.py scripts/twse_long_history_campaign.py
          python -m unittest tests.test_twse_dated_history tests.test_twse_long_history_campaign tests.test_official_market_feed -v
      - name: Preview initial TWSE source depth; no writes or API fetch
        if: steps.gate.outputs.should_run == 'true'
        run: python scripts/twse_long_history_campaign.py --max-rounds 14 --report twse-long-preview.json
      - name: Sequentially import at most 112 independent official market days
        if: steps.gate.outputs.should_run == 'true'
        env:
          STOCK_TWSE_LONG_HISTORY_CAMPAIGN_ENABLED: 'yes'
          STOCK_TWSE_HISTORY_WRITE_ENABLED: 'yes'
        run: python scripts/twse_long_history_campaign.py --apply --max-rounds 14 --report twse-long-evidence.json
      - name: Preserve official source and no-overwrite accounting evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twse-long-horizon-source-verified
          path: |
            twse-long-preview.json
            twse-long-evidence.json
          retention-days: 14
          if-no-files-found: ignore
