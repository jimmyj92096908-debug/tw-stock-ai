name: Guarded TWSE Official Rolling Five-Year Source Catch-Up

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/twse-long-history-campaign.yml'
  schedule:
    # Two separated daily windows: 09:30 and 17:30 Asia/Taipei.
    # Shared concurrency prevents overlapping official TWSE importers.
    - cron: '30 1,9 * * *'
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        required: true
        default: false
        description: 'Explicitly source-verify and append up to 160 older TWSE dates? Default preview.'

permissions:
  contents: read

# Same lock as the existing official dated TWSE schedule; no competing importer.
concurrency:
  group: twstock-dated-twse-history
  cancel-in-progress: false

jobs:
  long-history:
    if: >-
      github.repository == 'jimmyj92096908-debug/tw-stock-ai' &&
      (
        ((github.event_name == 'schedule' || github.event_name == 'push') && github.ref == 'refs/heads/main')
        ||
        (github.event_name == 'workflow_dispatch' &&
         github.ref == 'refs/heads/main' && inputs.apply == true)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      PYTHONPATH: .:src
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Use preexisting free Python dependencies
        run: pip install -r requirements.txt
      - name: Read-only five-year missing weekdays, current listing and free storage prerequisites
        id: gate
        run: python scripts/twse_five_year_source_gate.py
      - name: Verify official TWSE date/coverage parsing and fail-closed batch rules
        if: steps.gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          python -m py_compile src/twse_dated_history.py scripts/twse_long_history_campaign.py scripts/twse_five_year_source_gate.py scripts/twse_five_year_source_integrity.py
          python -m unittest tests.test_twse_dated_history tests.test_twse_long_history_campaign tests.test_twse_five_year_source_gate tests.test_twse_five_year_source_integrity tests.test_official_market_feed -v
      - name: Preview initial TWSE source depth; no writes or API fetch
        if: steps.gate.outputs.should_run == 'true'
        run: python scripts/twse_long_history_campaign.py --max-rounds 20 --report twse-long-preview.json
      - name: Evidence of conservative 50MB maintenance margin before official source writes
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python -c "from twse_dated_history import has_source_write_budget as safe; assert safe(610377728,days=8); assert not safe(745000000,days=8)"
          echo "- Neon Free TWSE source reserve: 50MB plus an 8-day upper-bound growth allowance." >> "$GITHUB_STEP_SUMMARY"
          echo "- Live database size is re-checked before each dated source insert; no derived history is generated." >> "$GITHUB_STEP_SUMMARY"
      - name: Sequentially import at most 160 independent official market days
        if: steps.gate.outputs.should_run == 'true'
        env:
          STOCK_TWSE_LONG_HISTORY_CAMPAIGN_ENABLED: 'yes'
          STOCK_TWSE_HISTORY_WRITE_ENABLED: 'yes'
        run: python scripts/twse_long_history_campaign.py --apply --max-rounds 20 --report twse-long-evidence.json
      - name: Record safe capacity pause separately from full completion
        if: steps.gate.outputs.should_run == 'true' && success()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('twse-long-evidence.json').read_text())
          assert not (r['finished'] and r['capacity_guard_blocked'])
          reason = 'Protected Neon Free storage reserve reached; resume only if capacity becomes available' if r['capacity_guard_blocked'] else 'Completed safe source batch'
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as out:
              out.write('### Official five-year backfill status\n')
              out.write('- '+reason+'\n')
              out.write('- New verified bars this run: '+str(sum(b['new_valid_bars'] for b in r['batches']))+'\n')
              out.write('- All five-year dates completed: '+str(r['finished'])+'\n')
          PY
      - name: Audit currently listed stock maturity and remaining source scope (read only)
        if: steps.gate.outputs.should_run == 'true' && success()
        run: python scripts/twse_five_year_maturity_audit.py --report twse-five-year-maturity.json
      - name: Independently verify every dated source receipt and actual OHLCV in Neon (read only)
        if: steps.gate.outputs.should_run == 'true' && success()
        run: python scripts/twse_five_year_source_integrity.py --report twse-verified-source-integrity.json
      - name: Audit observed free storage runway without writing to Neon
        if: steps.gate.outputs.should_run == 'true' && success()
        run: |
          python -m unittest tests.test_twse_storage_runway_audit -v
          python scripts/twse_storage_runway_audit.py --evidence twse-long-evidence.json --live-readonly --output twse-source-storage-runway.json
      - name: Preserve official source and no-overwrite accounting evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twse-long-horizon-source-verified
          path: |
            twse-long-preview.json
            twse-long-evidence.json
            twse-five-year-maturity.json
            twse-verified-source-integrity.json
            twse-source-storage-runway.json
          retention-days: 14
          if-no-files-found: ignore
