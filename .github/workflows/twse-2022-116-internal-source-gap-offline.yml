name: TWSE 2022 116 Internal Source Absence Triage (Offline)

on:
  pull_request:
    paths:
      - 'scripts/twse_2022_116_internal_source_absence_triage.py'
      - 'scripts/twse_2022_aes_neon_eligible_density_readonly.py'
      - 'tests/test_twse_2022_116_internal_source_absence_triage.py'
      - '.github/workflows/twse-2022-116-internal-source-gap-offline.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/twse_2022_116_internal_source_absence_triage.py'
      - 'scripts/twse_2022_aes_neon_eligible_density_readonly.py'
      - 'tests/test_twse_2022_116_internal_source_absence_triage.py'
      - '.github/workflows/twse-2022-116-internal-source-gap-offline.yml'

permissions:
  contents: read

jobs:
  source-absences-are-not-confirmed-missing-trades:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ''
      STOCK_ARCHIVE_KEY_HEX: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing free dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline synthetic 104+12 internal gap source provenance
        run: |
          unset PYTHONPATH
          python -m py_compile scripts/twse_2022_116_internal_source_absence_triage.py scripts/twse_2022_aes_neon_eligible_density_readonly.py
          python -m scripts.twse_2022_aes_neon_eligible_density_readonly --help >/dev/null
          python -m unittest tests.test_twse_2022_116_internal_source_absence_triage -v
          python -m unittest tests.test_twse_2022_aes_neon_eligible_density_readonly -v
