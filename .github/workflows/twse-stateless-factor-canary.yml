name: TWSE 2022 Five-Session Factor (No Neon Storage)

on:
  pull_request:
    paths:
      - 'scripts/twse_stateless_2022_factor_canary.py'
      - 'tests/test_twse_stateless_2022_factor_canary.py'
      - '.github/workflows/twse-stateless-factor-canary.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/twse_stateless_2022_factor_canary.py'
      - '.github/workflows/twse-stateless-factor-canary.yml'

permissions:
  contents: read

concurrency:
  group: twse-memory-only-2022-factor-research
  cancel-in-progress: false

jobs:
  offline-causal-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4' 'requests>=2.31,<3'
      - name: Verify five-session causal factor, bounded old sources and no writes
        run: |
          python -m py_compile scripts/twse_stateless_2022_factor_canary.py
          python -m unittest tests.test_twse_stateless_2022_factor_canary -v

  official-five-days-memory:
    needs: offline-causal-contract
    if: >-
      github.repository == 'jimmyj92096908-debug/tw-stock-ai' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .:src
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4' 'requests>=2.31,<3'
      - name: Calculate old source-only raw-price momentum in ephemeral RAM
        run: |
          test -n "$DATABASE_URL"
          python scripts/twse_stateless_2022_factor_canary.py \
            --output twse-2022-stateless-factor-summary.json
      - name: Explicit research-only and zero-Neon-write audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('twse-2022-stateless-factor-summary.json').read_text())
          assert len(d['source_days']) == 5
          assert d['fully_observed_five_session_stock_cohort'] >= 500
          assert d['source_ohlcv_rows_written'] == 0
          assert d['model_derived_rows_written'] == 0
          assert d['temporary_runner_memory_only'] is True
          assert d['historical_issuer_survivorship_free'] is False
          assert d['total_return_dividend_adjusted'] is False
          assert d['five_year_technical_factor_coverage_proven'] is False
          assert d['live_trading_approved'] is False
          print('Authentic 2022 TWSE price-only factor computed in memory; no Neon writes')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: twse-2022-five-session-aggregate-only-factor
          path: twse-2022-stateless-factor-summary.json
          retention-days: 14
          if-no-files-found: error
