name: Indicator Catch-Up Schedule Probe (Read-Only)

on:
  # This independent schedule verifies that nightly GitHub cron and the
  # existing Neon credential work. It NEVER runs indicator --apply.
  schedule:
    # 03:05 Asia/Taipei Tue-Sat (after official 01:50 history import).
    - cron: "5 19 * * 1-5"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/indicator_schedule_probe.py"
      - "tests/test_indicator_schedule_probe.py"
      - ".github/workflows/indicator-schedule-probe.yml"
  pull_request:
    paths:
      - "scripts/indicator_schedule_probe.py"
      - "tests/test_indicator_schedule_probe.py"
      - ".github/workflows/indicator-schedule-probe.yml"

permissions:
  contents: read

concurrency:
  group: twstock-indicator-probe-readonly
  cancel-in-progress: false

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install regression dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<10"
      - name: Verify read-only and bounded selection contracts
        run: |
          python -m py_compile scripts/indicator_schedule_probe.py
          python -m unittest tests.test_indicator_schedule_probe tests.test_stock_db_audit tests.test_batch_indicator_catchup -v
      - name: Check complete offline Python regression suite
        run: python -m pytest -q tests

  observe-neon:
    needs: offline-contract
    if: >-
      github.repository == 'jimmyj92096908-debug/tw-stock-ai' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install read-only SQL dependencies
        run: python -m pip install -r requirements.txt
      - name: Reject unset protected database environment
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL missing; no fabricated completion result."
            exit 1
          fi
      - name: Run identical bounded candidate query against live Neon READ ONLY snapshot
        run: |
          python scripts/indicator_schedule_probe.py --output indicator-schedule-probe.json
      - name: Upload aggregate-only reproducible preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: indicator-schedule-readonly-probe
          path: indicator-schedule-probe.json
          if-no-files-found: error
          retention-days: 14
      - name: Explicitly state no production mutations
        if: always()
        run: |
          {
            echo "### Independent read-only indicator schedule verification"
            echo "- This job does not modify indicators or scores."
            echo "- GitHub cron running successfully is separate from write-enabled catch-up."
            echo "- A future write schedule needs its own code review and authorization."
            echo "- No LINE Webhook, messaging or trading actions."
          } >> "$GITHUB_STEP_SUMMARY"
