name: Test OHLC quality classification

on:
  push:
    branches:
      - feature/ohlc-quality-classification
  pull_request:
    paths:
      - "src/ohlc_quality.py"
      - "tests/test_ohlc_quality.py"
      - ".github/workflows/test-ohlc-quality.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run OHLC quality tests
        run: python -m unittest tests.test_ohlc_quality -v
