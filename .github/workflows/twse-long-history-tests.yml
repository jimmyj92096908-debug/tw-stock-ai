name: TWSE Long-Horizon Official Source Safety Tests

on:
  pull_request:
    paths:
      - 'scripts/twse_long_history_campaign.py'
      - 'scripts/twse_five_year_source_gate.py'
      - 'src/twse_dated_history.py'
      - 'src/current_official_listing.py'
      - 'tests/test_twse_five_year_source_gate.py'
      - 'tests/test_twse_long_history_campaign.py'
      - '.github/workflows/twse-long-history-campaign.yml'
      - '.github/workflows/twse-long-history-tests.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4' 'requests>=2.31,<3'
      - name: Verify no-overwrite and official date-source batch accounting
        run: |
          python -m py_compile scripts/twse_long_history_campaign.py src/twse_dated_history.py
          python -m unittest tests.test_twse_long_history_campaign tests.test_twse_dated_history tests.test_twse_five_year_source_gate tests.test_official_market_feed -v

  postgres-source-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: stock_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d stock_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: .:src
      STOCK_CI_POSTGRES_URL: postgresql://test:test@127.0.0.1:5432/stock_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4' 'requests>=2.31,<3'
      - name: Confirm existing-price immutability and real inserted-row progress
        run: python -m unittest tests.test_twse_dated_history_postgres -v
