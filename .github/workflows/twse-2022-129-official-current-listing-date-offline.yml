name: TWSE 2022 No-Source 129 Official Current Listing Dates (Offline)

on:
  pull_request:
    paths:
      - 'scripts/twse_2022_official_current_listing_date_triage.py'
      - 'scripts/twse_2022_aes_neon_eligible_density_readonly.py'
      - 'tests/test_twse_2022_official_current_listing_date_triage.py'
      - '.github/workflows/twse-2022-129-official-current-listing-date-offline.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/twse_2022_official_current_listing_date_triage.py'
      - 'scripts/twse_2022_aes_neon_eligible_density_readonly.py'
      - 'tests/test_twse_2022_official_current_listing_date_triage.py'
      - '.github/workflows/twse-2022-129-official-current-listing-date-offline.yml'

permissions:
  contents: read

jobs:
  authentic-current-twse-listing-date-no-pit-claim:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ''
      STOCK_ARCHIVE_KEY_HEX: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing free dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline current official TWSE issuer listing-date source tests
        run: |
          unset PYTHONPATH
          python -m py_compile scripts/twse_2022_official_current_listing_date_triage.py scripts/twse_2022_aes_neon_eligible_density_readonly.py
          python -m unittest tests.test_twse_2022_official_current_listing_date_triage -v
          python -m unittest tests.test_twse_2022_aes_neon_eligible_density_readonly -v
