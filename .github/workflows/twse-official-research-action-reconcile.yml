name: TWSE Official Action Research Reconciliation (Offline)

on:
  pull_request:
    paths:
      - "scripts/twse_official_research_action_reconcile.py"
      - "tests/test_twse_official_research_action_reconcile.py"
      - "scripts/official_dividend_monthly_preview.py"
      - "tests/test_official_dividend_monthly_date_formats.py"
      - ".github/workflows/twse-official-research-action-reconcile.yml"
  push:
    branches: [main]
    paths:
      - "scripts/twse_official_research_action_reconcile.py"
      - "tests/test_twse_official_research_action_reconcile.py"
      - "scripts/official_dividend_monthly_preview.py"
      - "tests/test_official_dividend_monthly_date_formats.py"
      - ".github/workflows/twse-official-research-action-reconcile.yml"

permissions:
  contents: read

jobs:
  isolated-no-secret-test:
    if: github.repository == 'jimmyj92096908-debug/tw-stock-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free official preview parser dependencies (no credentials)
        run: python -m pip install requests 'psycopg[binary]'
      - name: Compile and run offline reconciler and ex-action date-format tests
        env:
          DATABASE_URL: ""
          PYTHONPATH: "."
        run: |
          python -m py_compile scripts/twse_official_research_action_reconcile.py scripts/official_dividend_monthly_preview.py tests/test_twse_official_research_action_reconcile.py tests/test_official_dividend_monthly_date_formats.py
          python -m unittest tests.test_twse_official_research_action_reconcile tests.test_official_dividend_monthly_date_formats -v
      - name: Document non-release evidence boundary
        if: always()
        run: |
          echo "### TWSE official action reconciliation: offline, no credentials" >> "$GITHUB_STEP_SUMMARY"
          echo "Tests do not fetch official sources, read Neon, alter prices, send LINE, or update model weights." >> "$GITHUB_STEP_SUMMARY"
          echo "Model remains BLOCKED without complete true total return and independent future evidence." >> "$GITHUB_STEP_SUMMARY"
