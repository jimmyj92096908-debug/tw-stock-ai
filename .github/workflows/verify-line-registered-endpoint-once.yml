# One-shot, read-only interrogation of the LINE Messaging API channel.
# NO user events, NO messages, NO webhook configuration changes.
name: Read-only LINE Registered Webhook Endpoint Verification (One Shot)
on:
  push:
    branches: [feature/production-readiness-20261120]
    paths:
      - .github/workflows/verify-line-registered-endpoint-once.yml
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'jimmyj92096908-debug/tw-stock-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
    steps:
      - name: Query configured webhook without exposing token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$LINE_CHANNEL_ACCESS_TOKEN" ]; then
            echo "::error::LINE_CHANNEL_ACCESS_TOKEN not configured in GitHub Actions; no request made"
            exit 1
          fi
          python - <<'PY'
          import json, os, urllib.request
          from urllib.parse import urlsplit

          expected_host = "br-purple-smoke-a1t9dmzz-linewebhook.compute.c-1.ap-southeast-1.aws.neon.tech"
          request=urllib.request.Request(
              "https://api.line.me/v2/bot/channel/webhook/endpoint",
              headers={"Authorization":"Bearer "+os.environ["LINE_CHANNEL_ACCESS_TOKEN"]})
          with urllib.request.urlopen(request,timeout=15) as response:
              if response.status!=200: raise SystemExit("LINE endpoint lookup failed")
              data=json.load(response)
          endpoint=data.get("endpoint","")
          parts=urlsplit(endpoint)
          print("LINE webhook is active:",data.get("active"))
          print("Matches expected existing Neon linewebhook:",parts.scheme=="https" and parts.hostname==expected_host and parts.path in ('','/','/webhook'))
          print("Configured URL path:",parts.path if parts.hostname==expected_host else "[other host redacted]")
          if parts.hostname!=expected_host:
              raise SystemExit("Existing webhook is not at expected legacy Neon function; do NOT replace it")
          if not data.get("active"):
              raise SystemExit("Webhook currently inactive; cannot safely assume legacy traffic")
          PY
