# One-time, owner-authorized production COVERAGE write. This file is
# deleted immediately after evidence is collected; never merged into main.
name: One-Time Owner-Authorized Indicator Coverage Pilot
on:
  push:
    branches: [feature/approved-indicator-coverage-pilot-20261121]
    paths:
      - ".github/workflows/one-time-owner-indicator-coverage-pilot.yml"
permissions:
  contents: read
# Serialize against the existing 03:10 scheduled indicator job.
concurrency:
  group: twstock-indicator-catchup
  cancel-in-progress: false
jobs:
  bounded-coverage:
    if: github.repository == 'jimmyj92096908-debug/tw-stock-ai' && github.ref == 'refs/heads/feature/approved-indicator-coverage-pilot-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install production model dependencies
        run: python -m pip install -r requirements.txt
      - name: Fail closed on missing database credential and test source code
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Protected DATABASE_URL not configured"; exit 1; fi
          python -m py_compile src/batch_indicator_catchup.py src/stock_db_audit.py src/composite_score.py
          python -m unittest -v tests.test_batch_indicator_catchup tests.test_stock_db_audit tests.test_indicator_schedule_probe tests.test_indicator_batch_reconcile tests.test_composite_score
      - name: Baseline indicator coverage using READ ONLY transaction
        run: |
          python scripts/indicator_schedule_probe.py --output indicator-before.json
          INVESTMENT_MODEL_READONLY=yes python scripts/investment_model_pipeline.py --live-readonly --market twse --stock-id 2330 --output model-before.json
      - name: Preview bounded market and stock candidates without writing
        run: |
          python src/batch_indicator_catchup.py --per-market 10
      - name: Explicitly apply at most ten verified-history stocks per market
        env:
          STOCK_INDICATOR_CATCHUP_WRITE_ENABLED: "yes"
        run: |
          python src/batch_indicator_catchup.py --apply --per-market 10
      - name: Read back official indicator coverage (read-only)
        if: always()
        run: |
          python scripts/indicator_schedule_probe.py --output indicator-after.json
      - name: Require actual progress on same market price day
        run: |
          python scripts/indicator_batch_reconcile.py --before indicator-before.json --after indicator-after.json --output indicator-progress-proof.json
      - name: Recalculate existing composite scores after successful verified indicator coverage
        run: |
          python -m unittest -v tests.test_composite_score tests.test_score_after_refresh
          python scripts/score_after_refresh.py
      - name: Re-evaluate complete research model using read-only data
        env:
          INVESTMENT_MODEL_READONLY: "yes"
        run: |
          python scripts/investment_model_pipeline.py --live-readonly --market twse --stock-id 2330 --output model-after.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("model-before.json").read_text())
          b=json.loads(Path("model-after.json").read_text())
          assert a["abstain_from_trading"] and b["abstain_from_trading"]
          assert not b["orders_enabled"] and not b["publish_line_trade_signal"]
          assert b["model"]["research_evidence_status"]=="INCOMPLETE_OR_FAILED"
          assert b["stock_data"]["price_date"]==a["stock_data"]["price_date"]
          old=a["ranking"].get("eligible_universe",0)
          new=b["ranking"].get("eligible_universe",0)
          assert isinstance(old,int) and isinstance(new,int)
          assert new>old, "No improvement in same-day scored/ranked cohort"
          s=b["stock_data"]
          assert s["technical_matches_latest_price"] and s["composite_matches_latest_price"], "2330 latest indicator or score remains stale"
          print("BOUNDED_COVERAGE_VERIFIED stock=twse/2330 old_ranked=%s new_ranked=%s market_price_date=%s technical_date=%s score_date=%s independent_chip_date=%s no_line_message=true no_trade=true" % (
            old,new,s["price_date"],s["technical_date"],s["composite_date"],s["independent_chip_date"]
          ))
          PY
      - name: Preserve only public-stock aggregate evidence (even if a stage fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-authorized-coverage-batch-audit
          path: |
            indicator-before.json
            indicator-after.json
            indicator-progress-proof.json
            model-before.json
            model-after.json
          if-no-files-found: ignore
          retention-days: 14
