name: Build Multi-Factor Composite Scores

# Legacy full-table rebuild is costly and must NEVER run on a feature-branch
# push or a mere workflow-file change. The separate bounded authorized
# official-snapshot workflow already handles normal daily score refresh.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Explicit full composite score rewrite on production main?"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

# Serialize with the existing protected composite-after-refresh writer.
concurrency:
  group: composite-score-after-market-refresh
  cancel-in-progress: false

jobs:
  test:
    if: >-
      github.repository == 'jimmyj92096908-debug/tw-stock-ai' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.apply == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests "psycopg[binary]>=3.2,<4"
      - run: python -m unittest tests.test_composite_score -v
      - run: python -m py_compile src/composite_score.py
  build:
    needs: test
    if: >-
      github.repository == 'jimmyj92096908-debug/tw-stock-ai' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.apply == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests "psycopg[binary]>=3.2,<4"
      - name: Validate database secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is missing."
            exit 1
          fi
      - name: Apply schema and calculate only when explicitly approved
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os, sys, psycopg
          sys.path.insert(0, "src")
          from tdcc_data import normalize_database_url
          with psycopg.connect(normalize_database_url(os.environ["DATABASE_URL"])) as conn:
              with conn.cursor() as cur:
                  cur.execute(open("sql/composite_score_schema.sql", encoding="utf-8").read())
          PY
          python src/composite_score.py
