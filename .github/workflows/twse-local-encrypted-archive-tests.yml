name: Local Encrypted TWSE Archive (Synthetic Safety Tests Only)

on:
  pull_request:
    paths:
      - 'scripts/twse_local_encrypted_archive.py'
      - 'tests/test_twse_local_encrypted_archive.py'
      - 'scripts/twse_local_archive_custody_audit.py'
      - 'tests/test_twse_local_archive_custody_audit.py'
      - 'scripts/twse_local_archive_source_reconcile.py'
      - 'tests/test_twse_local_archive_source_reconcile.py'
      - 'scripts/twse_lossless_archive_feasibility.py'
      - 'requirements.txt'
      - 'docs/twse-local-private-archive.md'
      - '.github/workflows/twse-local-encrypted-archive-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/twse_local_encrypted_archive.py'
      - 'tests/test_twse_local_encrypted_archive.py'
      - '.github/workflows/twse-local-encrypted-archive-tests.yml'

permissions:
  contents: read

jobs:
  synthetic-encryption-and-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free AES-GCM implementation, never Neon credentials
        run: python -m pip install 'cryptography>=43,<49'
      - name: Test exact source-recovery, tamper, replay, key and path safety
        run: |
          python -m py_compile scripts/twse_local_encrypted_archive.py scripts/twse_local_archive_custody_audit.py scripts/twse_local_archive_source_reconcile.py
          python -m unittest tests.test_twse_local_encrypted_archive tests.test_twse_local_archive_custody_audit tests.test_twse_local_archive_source_reconcile -v
      - name: Assert no production deletions or public artifact output
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('scripts/twse_local_encrypted_archive.py').read_text()
          w=Path('.github/workflows/twse-local-encrypted-archive-tests.yml').read_text()
          audit=Path('scripts/twse_local_archive_custody_audit.py').read_text()
          source=Path('scripts/twse_local_archive_source_reconcile.py').read_text()
          assert 'canonical_source_digest' in source
          assert 'READ ONLY' in source
          assert 'neon_delete_or_migrate_authorized' in audit
          assert 'verify_archive' in audit
          assert 'default_transaction_read_only=on' in s
          assert 'REPEATABLE READ, READ ONLY' in s
          assert "p.stock_id<>'1589'" in s
          assert 'model_stock_exclusions' in s
          # Avoid self-referential literal tests: these assertions are
          # themselves part of the workflow file under inspection.
          assert ('uses: actions/upload-' + 'artifact@') not in w
          assert ('secrets.' + 'DATABASE_URL') not in w
          assert ('workflow_' + 'dispatch') not in w
          assert ('live_trading_' + 'approved') not in w
          print('Offline-only AES-GCM safety CI; no private data exports')
          PY
