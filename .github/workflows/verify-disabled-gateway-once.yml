# One-time public health verification. No LINE user message or DB mutation.
name: Verify New Isolated LINE Gateway Disabled State (One Shot)
on:
  push:
    branches: [feature/production-readiness-20261120]
    paths: [.github/workflows/verify-disabled-gateway-once.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'jimmyj92096908-debug/tw-stock-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GATEWAY: https://br-purple-smoke-a1t9dmzz-linestockgateway.compute.c-1.ap-southeast-1.aws.neon.tech
    steps:
      - name: Verify separate Neon gateway deployed but NOT receiving LINE events
        shell: bash
        run: |
          set -euo pipefail
          health=$(curl --silent --show-error --max-time 25 --output /tmp/line-gateway-health --write-out '%{http_code}' "$GATEWAY/health")
          echo "Gateway GET /health: $health"
          test "$health" = "200"
          grep -qx 'ok' /tmp/line-gateway-health
          disabled=$(curl --silent --show-error --max-time 25 --output /tmp/line-gateway-disabled --write-out '%{http_code}' --header 'content-type: application/json' --data '{"events":[]}' "$GATEWAY/webhook")
          echo "Gateway POST /webhook while disabled: $disabled"
          test "$disabled" = "503"
          grep -q 'Gateway unavailable' /tmp/line-gateway-disabled
