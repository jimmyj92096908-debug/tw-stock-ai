name: LINE Stock Code Analysis Tests

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "line-stock-analysis/**"
      - ".github/workflows/line-stock-analysis-tests.yml"
  pull_request:
    paths:
      - "line-stock-analysis/**"
      - ".github/workflows/line-stock-analysis-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install LINE function dependencies
        working-directory: line-stock-analysis
        run: npm install --no-audit --no-fund
      - name: Test LINE stock command and signed webhook
        working-directory: line-stock-analysis
        run: npm test
      - name: Check syntax of runtime entrypoint
        run: node --check line-stock-analysis/index.mjs
      - name: Build self-contained Neon Node.js function
        working-directory: line-stock-analysis
        run: npm run bundle
      - name: Verify bundled function has valid syntax
        run: node --check line-stock-analysis/dist/index.mjs
      - name: Package deployment artifact (does not deploy)
        run: |
          cd line-stock-analysis/dist
          zip -q deployment.zip index.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: line-stock-analysis-neon-deployment
          path: line-stock-analysis/dist/deployment.zip
          if-no-files-found: error
          retention-days: 7
      - name: Export deploy bundle for one-time verified Neon staging handoff
        run: |
          echo 'NEON_STAGING_BUNDLE_SHA256:'
          sha256sum line-stock-analysis/dist/deployment.zip
          base64 -w0 line-stock-analysis/dist/deployment.zip | fold -w 120 | sed 's/^/NEON_STAGING_BUNDLE_B64:/'
