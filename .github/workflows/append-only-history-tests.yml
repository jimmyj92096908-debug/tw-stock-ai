name: Append-only History Import Safety

on:
  pull_request:
    paths:
      - 'src/db_storage.py'
      - 'tests/test_append_only_history_import.py'
      - 'tests/test_append_only_history_postgres.py'
      - '.github/workflows/append-only-history-tests.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install required database client (no credentials)
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Verify no-update SQL conflict behavior
        run: |
          python -m py_compile src/db_storage.py tests/test_append_only_history_import.py
          python -m unittest tests.test_append_only_history_import -v

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: stock_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d stock_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: .
      STOCK_CI_POSTGRES_URL: postgresql://test:test@127.0.0.1:5432/stock_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated database client
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Verify actual PostgreSQL nonoverwrite and inserted-row ledger
        run: python -m unittest tests.test_append_only_history_postgres -v
