name: TPEx Free CSV Export Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - run: python scripts/probe_tpex_csv_export.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tpex-free-csv-export-probe
          path: artifacts/tpex-csv-export-probe/
          retention-days: 14
