name: TWSE 2024 All Current Stocks 12 Raw Features (READ ONLY)

on:
  pull_request:
    paths:
      - 'scripts/twse_2024_all_12_features_readonly.py'
      - 'src/raw_factor_feature_bridge.py'
      - 'tests/test_twse_2024_all_12_features_readonly.py'
      - '.github/workflows/twse-2024-all-12-features-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/twse_2024_all_12_features_readonly.py'
      - '.github/workflows/twse-2024-all-12-features-readonly.yml'

permissions:
  contents: read

concurrency:
  group: twse-current-listed-all-12-features-2024-readonly
  cancel-in-progress: false

jobs:
  synthetic-all-feature-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Enforce one-source 12-feature causal vector for every eligible stock
        run: |
          python -m py_compile scripts/twse_2024_all_12_features_readonly.py
          python -m unittest -v tests.test_twse_2024_all_12_features_readonly

  protected-neon-all-12-readonly:
    needs: synthetic-all-feature-contract
    if: >-
      github.repository == 'jimmyj92096908-debug/tw-stock-ai' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      PYTHONPATH: .:src
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Compute all 12 technical SMC causal features for 800+ real saved stocks
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          python scripts/twse_2024_all_12_features_readonly.py \
            --output twse-2024-all-12-feature-aggregates.json
      - name: Require complete stock-level causality without model promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path('twse-2024-all-12-feature-aggregates.json')
          d=json.loads(f.read_text())
          n=d['eligible_current_listed_stocks']
          assert 800<=n<=1000
          assert d['genuine_2024_market_days']==242
          assert d['official_source_rows_evaluated']==242*n
          assert d['exact_ma240_no_future_checks']==n
          assert d['complete_12_technical_smc_feature_vectors']==n
          assert d['full_12_feature_prior_day_no_future_parity_checks']==n
          assert d['raw_factor_count']==12
          assert not d['historical_issuer_survivorship_free']
          assert not d['corporate_actions_adjusted']
          assert not d['historical_total_returns_proven']
          assert not d['independent_forward_cost_stressed_alpha_positive']
          assert not d['five_year_history_complete']
          assert d['neon_price_factor_model_rows_written']==0
          assert d['public_per_stock_source_or_vector_artifacts']==0
          assert d['line_messages_sent']==0
          assert not d['live_trading_approved']
          print(json.dumps(d,ensure_ascii=False,sort_keys=True))
          PY
      # No full OHLC, per-stock vectors, training labels or public artifacts.
