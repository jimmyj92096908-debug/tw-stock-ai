name: Technical indicator and signal tests

on:
  push:
    branches:
      - "feature/technical-indicators"
    paths:
      - "src/technical_indicators.py"
      - "src/technical_signals.py"
      - "src/smc.py"
      - "src/sync_smc.py"
      - "src/composite_scoring.py"
      - "src/sync_composite_scores.py"
      - "tests/test_technical_indicators.py"
      - "tests/test_technical_signals.py"
      - "tests/test_smc.py"
      - "tests/test_sync_smc.py"
      - "tests/test_composite_scoring.py"
      - "src/institutional_flows.py"
      - "tests/test_institutional_flows.py"
      - ".github/workflows/technical-indicators-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run technical indicator tests
        run: python -m unittest discover -s tests -p 'test_technical_indicators.py' -v
      - name: Run technical signal tests
        run: python -m unittest discover -s tests -p 'test_technical_signals.py' -v
      - name: Run SMC tests
        run: python -m unittest discover -s tests -p 'test_smc.py' -v
      - name: Run SMC sync mapping tests
        run: python -m unittest discover -s tests -p 'test_sync_smc.py' -v
      - name: Run composite scoring tests
        run: python -m unittest discover -s tests -p 'test_composite_scoring.py' -v
      - name: Run institutional flow tests
        run: python -m unittest discover -s tests -p 'test_institutional_flows.py' -v

  institutional-flow-smoke-test:
    needs: unit-tests
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Enable one-time institutional flow smoke test')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install requests "psycopg[binary]>=3.2,<4"
      - name: Fetch official institutional data for latest complete trading day
        run: python src/institutional_flows.py --date "2026-11-18"
