name: One-Time Authorized 2330 Chip History Missing-Only Import

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-authorized-2330-chip-history-import.yml"

permissions:
  contents: read

concurrency:
  group: tw-stock-daily-chip-ingest
  cancel-in-progress: false

jobs:
  insert-authorized-2330-only:
    if: github.repository == 'jimmyj92096908-debug/tw-stock-ai' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official feed and PostgreSQL dependencies
        run: pip install requests "psycopg[binary]>=3.2,<4"
      - name: Verify official parsers and insert-only guards offline
        run: |
          python -m unittest tests.test_chip_history_backfill tests.test_institutional_data tests.test_margin_data -v
          python -m py_compile src/chip_history_backfill.py
      - name: Authorized atomic 2330 insert-only backfill and preservation proof
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CHIP_HISTORY_WRITE_ENABLED: "yes"
          PYTHONPATH: src
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import date
          from psycopg import connect
          from psycopg.rows import dict_row
          from chip_history_backfill import (
              validate_options, plan_gaps, fetch_missing_twse, apply_missing
          )

          url = os.environ.get("DATABASE_URL")
          if not url:
              raise RuntimeError("DATABASE_URL missing; no authorized data write possible")
          if os.environ.get("CHIP_HISTORY_WRITE_ENABLED") != "yes":
              raise RuntimeError("Explicit user-approved write gate missing")
          stock, n = "2330", 25
          validate_options(stock, n, apply=True)
          earliest, latest = date(2026,10,15), date(2026,11,20)

          def original_rows(conn, table):
              with conn.cursor() as cur:
                  cur.execute(
                      f"SELECT trade_date, to_jsonb(t)::text AS row_copy "
                      f"FROM public.{table} t "
                      "WHERE market='twse' AND stock_id='2330' "
                      "AND trade_date BETWEEN %s AND %s ORDER BY trade_date",
                      (earliest,latest),
                  )
                  return {row["trade_date"]:row["row_copy"] for row in cur.fetchall()}

          # One psycopg connection, one outer transaction: a validation error
          # rolls back all candidate INSERTs, including both source tables.
          with connect(url, row_factory=dict_row, connect_timeout=20) as conn:
              before_inst = original_rows(conn, "institutional_flows")
              before_margin = original_rows(conn, "margin_short")
              if len(before_inst) != 1 or len(before_margin) != 1:
                  raise RuntimeError("Authorized baseline drift: expected one existing row per source")
              if set(before_inst) != {date(2026,11,18)} or set(before_margin) != {date(2026,11,18)}:
                  raise RuntimeError("Existing dated records differ from authorization baseline")

              gaps = plan_gaps(conn, stock, n)
              dated = {g["date"] for g in gaps}
              if len(gaps) != 25 or len(dated)!=25 or min(dated)!=earliest or max(dated)!=latest:
                  raise RuntimeError("Authorized 25-session 2330 price window has changed")
              expected_inst = {g["date"] for g in gaps if g["institutional_missing"]}
              expected_margin = {g["date"] for g in gaps if g["margin_missing"]}
              if len(expected_inst)!=24 or len(expected_margin)!=24:
                  raise RuntimeError("Missing date counts drifted; refusing to exceed authorized scope")
              print("AUTHORIZED_PREFLIGHT window=2026-10-15..2026-11-20 price_sessions=25 missing_inst=24 missing_margin=24")

              # Official source records are fully downloaded and validated
              # before INSERT. No other market / symbol / date is authorized.
              inst_rows, margin_rows = fetch_missing_twse(stock, gaps)
              for kind, rows, expected in (
                  ("institutional",inst_rows,expected_inst),
                  ("margin",margin_rows,expected_margin),
              ):
                  rows_dates=set()
                  for row in rows:
                      day=date.fromisoformat(str(row["trade_date"]))
                      if row["market"]!="twse" or row["stock_id"]!=stock or day not in expected:
                          raise RuntimeError(f"Unexpected {kind} stock/date outside authorized scope")
                      if day in rows_dates:
                          raise RuntimeError(f"Duplicate {kind} date")
                      rows_dates.add(day)
                  if rows_dates!=expected:
                      raise RuntimeError(f"Incomplete {kind} official-date coverage")
              print("OFFICIAL_VERIFIED institutional=24 margin=24 matched_dates=true")

              inst_added, margin_added=apply_missing(conn,inst_rows,margin_rows)
              if (inst_added,margin_added)!=(24,24):
                  raise RuntimeError(
                      f"Atomic insert count mismatch: institutional={inst_added} margin={margin_added}"
                  )
              after_inst = original_rows(conn,"institutional_flows")
              after_margin = original_rows(conn,"margin_short")
              for original,new in ((before_inst,after_inst),(before_margin,after_margin)):
                  if any(new.get(day)!=data for day,data in original.items()):
                      raise RuntimeError("Original database rows changed unexpectedly: rolling back")
                  if len(new)!=25:
                      raise RuntimeError("Post-write source coverage not exactly 25: rolling back")
              print("AUTHORIZED_COMMIT inserted_institutional=24 inserted_margin=24 original_rows_unchanged=true")
          PY
