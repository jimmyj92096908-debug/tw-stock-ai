name: TWSE 2022 Two Unpriced Long Gap MI_INDEX Crosscheck (Offline)

on:
  pull_request:
    paths:
      - 'scripts/twse_2022_2_unpriced_gap_daily_mi_index_readonly.py'
      - 'tests/test_twse_2022_2_unpriced_gap_daily_mi_index_readonly.py'
      - '.github/workflows/twse-2022-2-unpriced-gap-mi-index-offline.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/twse_2022_2_unpriced_gap_daily_mi_index_readonly.py'
      - 'tests/test_twse_2022_2_unpriced_gap_daily_mi_index_readonly.py'
      - '.github/workflows/twse-2022-2-unpriced-gap-mi-index-offline.yml'

permissions:
  contents: read

jobs:
  original-monthly-vs-daily-source-date-unpriced-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ''
      STOCK_ARCHIVE_KEY_HEX: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free existing Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline original STOCK_DAY uncertain dates vs MI_INDEX source checks
        run: |
          unset PYTHONPATH
          python -m py_compile scripts/twse_2022_2_unpriced_gap_daily_mi_index_readonly.py
          python -m unittest tests.test_twse_2022_2_unpriced_gap_daily_mi_index_readonly -v
