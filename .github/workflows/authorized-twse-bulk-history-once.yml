# One-shot user-authorized import; delete after success or failure.
name: Authorized TWSE Dated Bulk History (One Shot)
on:
  push:
    branches:
      - feature/dated-bulk-history-backfill
    paths:
      - .github/workflows/authorized-twse-bulk-history-once.yml

permissions:
  contents: read
concurrency:
  group: authorized-twse-dated-bulk-history
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'jimmyj92096908-debug/tw-stock-ai' && github.ref == 'refs/heads/feature/dated-bulk-history-backfill'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact repository requirements and pytest
        run: pip install -r requirements.txt pytest
      - name: Confirm syntax, official date-source checks and fail-closed gates
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Missing DATABASE_URL"; exit 1; fi
          python -m py_compile src/twse_dated_history.py src/official_snapshot_ingest.py src/official_market_feed.py
          python -m unittest tests.test_official_market_feed tests.test_twse_dated_history -v
      - name: Verify real source for two recent trade dates WITHOUT writes
        run: python src/twse_dated_history.py --batch-days 2 --lookback-days 7
      - name: Run one bounded official dated historical import after source validation
        env:
          STOCK_TWSE_HISTORY_WRITE_ENABLED: "yes"
        run: python src/twse_dated_history.py --apply --batch-days 8 --lookback-days 21
      - name: Verify official past sessions and preserved earlier source records
        run: |
          python - <<'PY'
          import os,psycopg
          from datetime import date
          with psycopg.connect(os.environ['DATABASE_URL']) as conn:
              with conn.cursor() as cur:
                  cur.execute("""SELECT trade_date,status,qualified,inserted
                      FROM public.twse_history_day_progress
                      WHERE trade_date >= DATE '2026-11-10' AND trade_date <= DATE '2026-11-19'
                      ORDER BY trade_date DESC""")
                  rows=cur.fetchall()
                  cur.execute("""SELECT COUNT(*)::int FROM public.daily_prices
                      WHERE market='twse' AND trade_date=DATE '2026-11-18' AND close IS NOT NULL""")
                  day18=cur.fetchone()[0]
                  cur.execute("""SELECT COUNT(*)::int FROM public.daily_prices
                      WHERE market='twse' AND trade_date=DATE '2026-11-19' AND close IS NOT NULL""")
                  day19=cur.fetchone()[0]
                  cur.execute("""SELECT COUNT(*)::int FROM public.daily_prices
                      WHERE market='twse' AND close IS NOT NULL""")
                  all_rows=cur.fetchone()[0]
          print("Imported session count:",len(rows))
          for day,status,qualified,inserted in rows:
              print(f"{day}: {status}, qualified={qualified}, new={inserted}")
          print(f"TWSE days: 11/18={day18}, 11/19={day19}; TWSE non-null history={all_rows}")
          if len(rows)!=8 or day18<800 or day19<800 or all_rows<10000:
              raise SystemExit("Bulk history verification did not meet conservative thresholds")
          PY
