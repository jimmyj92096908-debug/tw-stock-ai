name: TWSE 2021 All 28 AES Neon Current Cohort Stock Date Union (Offline)

on:
  pull_request:
    paths:
      - 'scripts/twse_2021_28day_aes_neon_stock_date_union_readonly.py'
      - 'tests/test_twse_2021_28day_aes_neon_stock_date_union_readonly.py'
      - '.github/workflows/twse-2021-28-aes-neon-stock-date-union-offline.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/twse_2021_28day_aes_neon_stock_date_union_readonly.py'
      - 'tests/test_twse_2021_28day_aes_neon_stock_date_union_readonly.py'
      - '.github/workflows/twse-2021-28-aes-neon-stock-date-union-offline.yml'

permissions:
  contents: read

jobs:
  source-stock-date-dedup-is-not-a-price-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ''
      STOCK_ARCHIVE_KEY_HEX: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing free dependencies
        run: python -m pip install -r requirements.txt
      - name: Synthetic official 28 days AES plus Neon exact union and previous receipt freeze
        run: |
          unset PYTHONPATH
          python -m py_compile scripts/twse_2021_28day_aes_neon_stock_date_union_readonly.py
          python -m unittest tests.test_twse_2021_28day_aes_neon_stock_date_union_readonly -v
          python -m unittest tests.test_twse_2021_28day_aes_current_cohort_density_readonly -v
