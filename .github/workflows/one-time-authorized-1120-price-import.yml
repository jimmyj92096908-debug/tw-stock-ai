name: One-Time Authorized Nov 20 Missing-Only Official Price Import

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-authorized-1120-price-import.yml"

permissions:
  contents: read

# Serialized with the standing 23:00 official snapshot job.
concurrency:
  group: official-daily-market-snapshot
  cancel-in-progress: false

jobs:
  apply-nov20-missing-only:
    if: github.repository == 'jimmyj92096908-debug/tw-stock-ai' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install parser and PostgreSQL dependencies
        run: pip install "psycopg[binary]>=3.2,<4" requests
      - name: Verify offline official-feed contract
        run: |
          python -m unittest tests.test_official_market_feed -v
          python -m py_compile src/official_market_feed.py src/official_snapshot_ingest.py
      - name: Insert missing Nov 20 official price bars only
        env:
          STOCK_SNAPSHOT_WRITE_ENABLED: "yes"
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import date
          from official_market_feed import fetch_latest_snapshot
          from official_snapshot_ingest import run

          target = date(2026, 11, 20)
          if os.environ.get("STOCK_SNAPSHOT_WRITE_ENABLED") != "yes":
              raise SystemExit("Explicit write gate missing")
          url = os.environ.get("DATABASE_URL", "")
          if not url:
              raise SystemExit("Database connection secret missing")

          def checked_fetch(market, *, today):
              if today != target or market not in ("twse", "tpex"):
                  raise ValueError("Requested target date or market is outside authorization")
              day, bars = fetch_latest_snapshot(market, today=today)
              if day != target:
                  raise ValueError("Official feed date does not match authorized 2026-11-20")
              if len(bars) < (800 if market == "twse" else 650):
                  raise ValueError("Official feed coverage is unexpectedly low")
              return day, bars

          # Existing ingestion path validates eligible stock_master candidates
          # for BOTH markets before ANY INSERT and uses ON CONFLICT DO NOTHING.
          results = run(url, apply=True, fetcher=checked_fetch, today=target)
          if len(results) != 2 or {r["market"] for r in results} != {"twse", "tpex"}:
              raise RuntimeError("Expected both approved markets")
          for row in results:
              print(
                  f"AUTHORIZED_IMPORT market={row['market']} date={row['trade_date']} "
                  f"qualified={row['qualified']} inserted={row['inserted']} mode={row['mode']}"
              )
          PY
