name: Composite Scores After Verified Official Snapshot

on:
  workflow_run:
    workflows:
      - "Official Taiwan Market Daily Snapshot (Authorized)"
      - "Verified History Indicator Catch-Up"
    types:
      - completed
  workflow_dispatch:
    inputs:
      apply:
        description: "明確同意寫入綜合評分？預設 false，不做任何資料庫異動"
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: composite-score-after-market-refresh
  cancel-in-progress: false

jobs:
  score:
    # Owner approved automatic composite scores after the official source
    # snapshot completed successfully on main. Manual dispatch remains opt-in.
    # Successful source jobs include a no-write preview when main is updated.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.repository.full_name == github.repository &&
       (
         (github.event.workflow_run.name == 'Official Taiwan Market Daily Snapshot (Authorized)' &&
          github.event.workflow_run.event == 'schedule')
         ||
         (github.event.workflow_run.name == 'Verified History Indicator Catch-Up' &&
          github.event.workflow_run.event == 'schedule')
       ))
      ||
      (github.event_name == 'workflow_dispatch' && inputs.apply == true)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit-test score logic and guard
        run: |
          python -m unittest tests.test_composite_score tests.test_score_after_refresh -v
          python -m py_compile scripts/score_after_refresh.py
      - name: Require configured database credential
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is unavailable; score rebuild is stopped."
            exit 1
          fi
      - name: Recompute existing composite score table
        run: python scripts/score_after_refresh.py
      # Only the scheduled same-day 23:00 official source job starts this
      # prospective freeze. The next-morning indicator catchup may revise
      # the existing score day, so it must not retroactively change a frozen
      # precommitted signal cohort.
      - name: Freeze real prospective full-research roster after official same-day score
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.name == 'Official Taiwan Market Daily Snapshot (Authorized)'
        env:
          STOCK_FORWARD_RESEARCH_FREEZE_WRITE: "yes"
        run: |
          python -m unittest tests.test_research_forward_freeze -v
          python scripts/freeze_prospective_research.py --apply --report prospective-research-freeze-evidence.json
      - name: Retain aggregate-only prospective research precommit proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-only-forward-precommit-evidence
          path: prospective-research-freeze-evidence.json
          retention-days: 14
          if-no-files-found: ignore
