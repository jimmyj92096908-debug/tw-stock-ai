name: TWSE Lossless Archive Feasibility (Read Only)

on:
  pull_request:
    paths:
      - 'scripts/twse_lossless_archive_feasibility.py'
      - 'tests/test_twse_lossless_archive_feasibility.py'
      - '.github/workflows/twse-lossless-archive-proof.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/twse_lossless_archive_feasibility.py'
      - '.github/workflows/twse-lossless-archive-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twse-lossless-private-archive-sample-readonly
  cancel-in-progress: false

jobs:
  synthetic-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify reversible numeric source and bounded read-only code
        run: |
          python -m py_compile scripts/twse_lossless_archive_feasibility.py
          python -m unittest -v tests.test_twse_lossless_archive_feasibility

  actual-neon-readonly:
    if: >-
      github.repository == 'jimmyj92096908-debug/tw-stock-ai' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    needs: synthetic-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .:src
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Compress and rehydrate five real TWSE source dates only in memory
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          python scripts/twse_lossless_archive_feasibility.py \
            --start 2026-11-16 --end 2026-11-20 \
            --output twse-archive-feasibility-summary.json
      - name: Verify only numeric/hashes are publishable and cutover is blocked
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('twse-archive-feasibility-summary.json').read_text())
          assert d['sample_rows']>=1000
          assert d['restored_rows_equal_original_including_exact_decimal_and_vintage']
          assert d['raw_or_compressed_price_rows_uploaded_to_public_repository'] is False
          assert d['production_neon_rows_written']==0
          assert d['production_neon_indexes_dropped']==0
          assert d['same_sample_is_not_a_durable_backup'] is True
          assert d['production_migration_approved'] is False
          assert d['paid_upgrade_requested'] is False
          print('Integrity verified; only aggregate compression ratio retained')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: twse-aggregate-compression-feasibility-only
          path: twse-archive-feasibility-summary.json
          retention-days: 14
          if-no-files-found: error
