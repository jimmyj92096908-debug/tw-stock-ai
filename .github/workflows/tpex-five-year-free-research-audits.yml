name: TPEx Free On-Demand Features and Fundamental Vintage Read-Only Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/tpex-free-on-demand-pit-audit-20261121.txt"
  workflow_run:
    workflows:
      - "Official Monthly Revenue First-Seen Archive (Research Only)"
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: twstock-on-demand-pit-readonly-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  one-time-and-monthly-pit-audit:
    if: >-
      github.repository == 'jimmyj92096908-debug/tw-stock-ai' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Require exact newly committed one-time read-only marker
        id: marker
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] &&
            git diff --name-only --diff-filter=A HEAD^ HEAD |
              grep -Fxq ".github/tpex-free-on-demand-pit-audit-20261121.txt"; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing free dependencies
        run: python -m pip install -r requirements.txt
      - name: Regression-test genuine in-memory original-source computation and first-seen gates
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          python -m py_compile scripts/tpex_on_demand_research.py scripts/official_fundamental_temporal_witness.py
          python -m unittest tests.test_tpex_free_on_demand_pit tests.test_technical_indicators tests.test_smc_indicators tests.test_official_fundamental_pit_coverage -v
      - name: Recompute existing TPEx research factors in memory only, no materialization
        if: github.event_name == 'workflow_run' || steps.marker.outputs.new == 'true'
        run: |
          python scripts/tpex_on_demand_research.py --stock-id 5520 --as-of 2026-11-20 --limit 2 --report tpex-on-demand-research-proof.json
      - name: Verify actual archived financial first-seen time is not backdated into old market signals
        if: github.event_name == 'workflow_run' || steps.marker.outputs.new == 'true'
        run: python scripts/official_fundamental_temporal_witness.py --report official-pit-temporal-proof.json
      - name: Preserve bounded read-only proof; no historical alpha or trading claims
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpex-free-on-demand-and-official-pit-readonly
          path: |
            tpex-on-demand-research-proof.json
            official-pit-temporal-proof.json
          retention-days: 14
          if-no-files-found: ignore
