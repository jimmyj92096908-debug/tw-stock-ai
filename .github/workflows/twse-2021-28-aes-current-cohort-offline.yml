name: TWSE 2021 28 Real AES Days Current Cohort Coverage (Offline)

on:
  pull_request:
    paths:
      - 'scripts/twse_2021_28day_aes_current_cohort_density_readonly.py'
      - 'tests/test_twse_2021_28day_aes_current_cohort_density_readonly.py'
      - '.github/workflows/twse-2021-28-aes-current-cohort-offline.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/twse_2021_28day_aes_current_cohort_density_readonly.py'
      - 'tests/test_twse_2021_28day_aes_current_cohort_density_readonly.py'
      - '.github/workflows/twse-2021-28-aes-current-cohort-offline.yml'

permissions:
  contents: read

jobs:
  authenticated-aes-source-observed-day-vs-stock-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ''
      STOCK_ARCHIVE_KEY_HEX: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing free deps
        run: python -m pip install -r requirements.txt
      - name: Synthetic offline 2021-11-23 five-year baseline and 28 AES source day density
        run: |
          unset PYTHONPATH
          python -m py_compile scripts/twse_2021_28day_aes_current_cohort_density_readonly.py
          python -m unittest tests.test_twse_2021_28day_aes_current_cohort_density_readonly -v
