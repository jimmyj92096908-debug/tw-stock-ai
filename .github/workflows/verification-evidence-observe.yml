name: Verification Evidence (Observe Only)
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'line-stock-analysis/**'
      - 'scripts/verification_evidence.py'
      - '.github/workflows/verification-evidence-observe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [python, line]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: line_ci_test
          POSTGRES_USER: line_ci_test
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U line_ci_test -d line_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        if: matrix.suite == 'line'
        with:
          node-version: '24'
      - name: Install Python requirements
        if: matrix.suite == 'python'
        run: python -m pip install -r requirements.txt
      - name: Install LINE requirements
        if: matrix.suite == 'line'
        working-directory: line-stock-analysis
        run: npm install --no-audit --no-fund
      - name: Execute observable checks
        id: verification
        continue-on-error: true
        env:
          LINE_CI_POSTGRES_URL: postgresql://line_ci_test:ci-disposable-only@127.0.0.1:5432/line_ci_test
          STOCK_CI_POSTGRES_URL: postgresql://line_ci_test:ci-disposable-only@127.0.0.1:5432/line_ci_test
        run: python scripts/verification_evidence.py --suite '${{ matrix.suite }}' --output 'verification-${{ matrix.suite }}.json'
      - name: Publish evidence summary
        if: always()
        env:
          SUITE: ${{ matrix.suite }}
          OUTCOME: ${{ steps.verification.outcome }}
        run: |
          echo "### Verification observation: ${SUITE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runner outcome: ${OUTCOME}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Attached evidence: verification-${SUITE}.json" >> "$GITHUB_STEP_SUMMARY"
          echo "- Not verified: real LINE messages, production Neon or webhook cutover." >> "$GITHUB_STEP_SUMMARY"
          echo "- Observe-only: this result does not block merging." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence-${{ matrix.suite }}
          path: verification-${{ matrix.suite }}.json
          if-no-files-found: warn
          retention-days: 14
