name: Build Corporate-Action Adjusted Prices
# Writing adjusted/technical bars on a source-code push can race an
# independent per-stock production indicator campaign. Manual opt-in only.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Rebuild the four specified adjusted/technical/SMC stocks on production main? Default is preview only.'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: corporate-action-adjustments
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.repository == 'jimmyj92096908-debug/tw-stock-ai' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.apply == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - name: Test adjustment math
        run: pytest -q tests/test_adjusted_prices.py
      - name: Apply schema and build four-stock adjusted bars
        run: |
          python - <<'PY'
          import os, psycopg
          sql=open("sql/corporate_actions_schema.sql",encoding="utf-8").read()
          with psycopg.connect(os.environ["DATABASE_URL"]) as conn:
              conn.execute(sql)
          print("Corporate-action schema applied.")
          PY
          python src/build_adjusted_prices.py --market both --stock-ids 6213 4919 7827 8937
          for stock in 6213 4919 7827; do
            python src/calculate_technicals.py --market twse --stock-id "$stock"
            python src/calculate_smc.py --market twse --stock-id "$stock"
          done
          python src/calculate_technicals.py --market tpex --stock-id 8937
          python src/calculate_smc.py --market tpex --stock-id 8937
