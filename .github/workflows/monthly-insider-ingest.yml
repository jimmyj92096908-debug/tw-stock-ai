name: Monthly Insider Holdings Accumulation
on:
  schedule:
    - cron: "20 14 15,25 * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tw-stock-monthly-insider
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is missing."
            exit 1
          fi
      - name: Install dependencies
        run: pip install requests "psycopg[binary]>=3.2,<4"
      - name: Test insider holdings parser
        run: python -m unittest tests.test_insider_holdings_data -v
      - name: Import latest official monthly snapshot
        run: python src/insider_holdings_data.py
      - name: Recalculate composite chip scores
        run: python src/chip_score.py
