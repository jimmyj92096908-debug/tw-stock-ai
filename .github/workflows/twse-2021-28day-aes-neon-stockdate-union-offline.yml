name: TWSE 2021 28-Day AES Neon Exact Stock-Date Union (Offline)

on:
  pull_request:
    paths:
      - 'scripts/twse_2021_28day_aes_neon_stockdate_union_readonly.py'
      - 'tests/test_twse_2021_28day_aes_neon_stockdate_union_readonly.py'
      - '.github/workflows/twse-2021-28day-aes-neon-stockdate-union-offline.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/twse_2021_28day_aes_neon_stockdate_union_readonly.py'
      - 'tests/test_twse_2021_28day_aes_neon_stockdate_union_readonly.py'
      - '.github/workflows/twse-2021-28day-aes-neon-stockdate-union-offline.yml'

permissions:
  contents: read

jobs:
  exact-source-key-set-overlap-no-price-or-neon-writes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ''
      STOCK_ARCHIVE_KEY_HEX: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free existing Python dependencies
        run: python -m pip install -r requirements.txt
      - name: No secrets synthetic 2021 28-day 26120 AES + 552 Neon stock/date union
        run: |
          unset PYTHONPATH
          python -m py_compile scripts/twse_2021_28day_aes_neon_stockdate_union_readonly.py
          python -m unittest tests.test_twse_2021_28day_aes_neon_stockdate_union_readonly -v
          python -m unittest tests.test_twse_2021_28day_aes_current_cohort_density_readonly -v
