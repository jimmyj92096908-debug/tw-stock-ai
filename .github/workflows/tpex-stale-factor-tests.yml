name: TPEx Post-Backfill Factor Freshness Safety Tests

on:
  pull_request:
    paths:
      - 'scripts/tpex_stale_factor_refresh.py'
      - 'tests/test_tpex_stale_factor_refresh.py'
      - 'tests/test_tpex_factor_bootstrap_workflow.py'
      - 'tests/test_tpex_stale_factor_refresh_postgres.py'
      - '.github/workflows/tpex-historical-factor-freshness.yml'
      - '.github/workflows/tpex-stale-factor-tests.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Historical source and score no-price-write regression
        run: |
          python -m py_compile scripts/tpex_stale_factor_refresh.py
          python -m unittest tests.test_tpex_stale_factor_refresh tests.test_tpex_factor_bootstrap_workflow -v

  isolated-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: stock_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d stock_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: .:src
      STOCK_CI_POSTGRES_URL: postgresql://test:test@127.0.0.1:5432/stock_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: On real disposable PG17 prove older append invalidates latest factor and score
        run: python -m unittest tests.test_tpex_stale_factor_refresh_postgres -v
