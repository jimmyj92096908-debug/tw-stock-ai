name: Test New Stock History Refresh

on:
  push:
    paths:
      - "src/full_market_refresh.py"
      - "tests/test_full_market_refresh.py"
      - ".github/workflows/full-market-daily.yml"
      - ".github/workflows/test-new-stock-refresh.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile refresh module
        run: python -m py_compile src/full_market_refresh.py

      - name: Run refresh unit tests
        env:
          PYTHONPATH: src
        run: pytest -q tests/test_full_market_refresh.py
