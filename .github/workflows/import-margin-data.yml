name: Import Margin and Short Data for Requested Stocks
on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: "交易日期 YYYY-MM-DD（TPEx 僅提供最新快照，日期不符會停止）"
        required: true
        default: "2026-11-17"
permissions:
  contents: read
concurrency:
  group: tw-stock-margin-import
  cancel-in-progress: false
jobs:
  import-margin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TRADE_DATE: ${{ inputs.trade_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is missing."
            exit 1
          fi
      - run: pip install requests "psycopg[binary]>=3.2,<4"
      - name: Test margin parser
        run: python -m unittest tests.test_margin_data -v
      - name: Fetch and import official margin data
        run: python src/margin_data.py --date "$TRADE_DATE"
      - name: Verify Neon rows
        run: |
          python - <<'PY'
          import os
          import psycopg
          from psycopg.rows import dict_row

          expected = [("twse", "6213"), ("twse", "4919"), ("tpex", "8937")]
          with psycopg.connect(os.environ["DATABASE_URL"], row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  for market, code in expected:
                      cur.execute("""
                          SELECT count(*) AS rows, max(margin_balance) AS margin_balance,
                                 max(short_balance) AS short_balance
                          FROM margin_short
                          WHERE market=%s AND stock_id=%s AND trade_date=%s
                      """, (market, code, os.environ["TRADE_DATE"]))
                      row = cur.fetchone()
                      print(market, code, row)
                      if row["rows"] != 1:
                          raise SystemExit(f"Missing margin row for {market} {code}")
          print("注意：TWSE 7827 若未列入信用交易標的，當日不會有 margin_short 資料列。")
          PY
