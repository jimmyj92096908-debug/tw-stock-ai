name: Import Margin and Short Data for Requested Stocks
on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: "交易日期 YYYY-MM-DD（TPEx 僅提供最新快照，日期不符會停止）"
        required: true
        default: "2026-11-17"
permissions:
  contents: read
concurrency:
  group: tw-stock-margin-import
  cancel-in-progress: false
jobs:
  import-margin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TRADE_DATE: ${{ inputs.trade_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is missing."
            exit 1
          fi
      - run: pip install requests "psycopg[binary]>=3.2,<4"
      - name: Test margin parser
        run: python -m unittest tests.test_margin_data -v
      - name: Fetch and import official margin data
        run: python src/margin_data.py --date "$TRADE_DATE"
      - name: Verify Neon rows
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["DATABASE_URL"]) as conn:
              with conn.cursor() as cur:
                  for market in ("twse", "tpex"):
                      cur.execute("""
                          SELECT count(*),
                                 count(*) FILTER (WHERE margin_balance IS NOT NULL),
                                 count(*) FILTER (WHERE short_balance IS NOT NULL),
                                 count(DISTINCT stock_id)
                          FROM margin_short
                          WHERE market=%s AND trade_date=%s
                      """, (market, os.environ["TRADE_DATE"]))
                      rows, margin_ok, short_ok, distinct_stocks = cur.fetchone()
                      print(market, {"rows": rows, "margin_balance_present": margin_ok,
                                     "short_balance_present": short_ok, "distinct_stocks": distinct_stocks})
                      if rows == 0 or rows != distinct_stocks or rows != margin_ok or rows != short_ok:
                          raise SystemExit(f"{market} 融資融券資料驗收失敗")
          print("上市／上櫃融資融券資料驗收通過")
          PY
