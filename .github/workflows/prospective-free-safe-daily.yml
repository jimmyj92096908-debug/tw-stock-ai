name: Safe Prospective Research Precommit and Free Budget Proof

on:
  push:
    branches: [main]
    paths:
      - ".github/neon-free-forward-once-20261121.txt"
  workflow_run:
    workflows:
      - "Official Taiwan Market Daily Snapshot (Authorized)"
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      apply:
        description: "Explicitly write one new immutable prospective research cohort? Default preview."
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: composite-score-after-market-refresh
  cancel-in-progress: false

jobs:
  safe-free-precommit:
    if: >-
      github.repository == 'jimmyj92096908-debug/tw-stock-ai' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'schedule' &&
        github.event.workflow_run.repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONPATH: .:src
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Require exact one-shot read-only push marker
        id: marker
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            git diff --name-only --diff-filter=A HEAD^ HEAD |
              grep -Fxq ".github/neon-free-forward-once-20261121.txt"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing free dependencies only
        run: python -m pip install -r requirements.txt
      - name: Regress no-backdate immutable prospective research and honest network unknown
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          python -m py_compile scripts/neon_free_meter_guard.py scripts/prospective_forward_maturity_readonly.py scripts/freeze_prospective_research.py
          python -m unittest tests.test_free_quota_and_prospective_continuation tests.test_research_forward_freeze -v
      - name: Audit actual database headroom plus Neon network counter if API token exists
        run: python scripts/neon_free_meter_guard.py --report neon-free-budget-before.json
      - name: Read-only prospective full-cohort precommit preview after latest verified close
        run: python scripts/freeze_prospective_research.py --report prospective-preview.json
      - name: Insert ONE actual pre-return immutable research-only cohort (no LINE or live trade)
        if: >-
          github.event_name == 'workflow_run' ||
          (github.event_name == 'workflow_dispatch' && inputs.apply == true)
        env:
          STOCK_FORWARD_RESEARCH_FREEZE_WRITE: 'yes'
        run: |
          set -euo pipefail
          # Large write jobs must never be authorized on unknown network usage.
          # A tiny bounded <=1.8MB once-per-new-day precommit is not an
          # intensive backfill. Independently require safe database headroom.
          python - <<'PY'
          import json,sys
          meter=json.load(open("neon-free-budget-before.json"))
          if meter["database_bytes"]>=650000000:
              sys.exit("Stop prospective writes at >=650MB storage")
          if meter["network_transfer_status"]=="PAUSE_NEW_NONESSENTIAL_WORK":
              sys.exit("Conservative Neon transfer pause threshold reached")
          PY
          python scripts/freeze_prospective_research.py --apply --report prospective-applied.json
      - name: Verify earlier sealed research outcomes are mature, never revise a saved prediction
        if: success()
        run: python scripts/prospective_forward_maturity_readonly.py --report prospective-older-cohort-outcomes.json
      - name: Preserve aggregate storage/network honesty and immutable cohort hash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-free-prospective-research-evidence
          path: |
            neon-free-budget-before.json
            prospective-preview.json
            prospective-applied.json
            prospective-older-cohort-outcomes.json
          retention-days: 14
          if-no-files-found: ignore
