name: TPEx Dated Bulk Canary - Offline Safety Tests

on:
  pull_request:
    paths:
      - 'src/tpex_dated_bulk_canary.py'
      - 'tests/test_tpex_dated_bulk_canary.py'
      - '.github/workflows/tpex-dated-canary-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-canary-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline parser dependency
        run: python -m pip install 'requests>=2.31,<3'
      - name: Compile and verify fail-closed no-write behavior
        run: |
          python -m py_compile src/tpex_dated_bulk_canary.py tests/test_tpex_dated_bulk_canary.py
          python -m unittest tests.test_tpex_dated_bulk_canary -v
      - name: Probe two historical TPEx sessions without database access
        run: |
          python src/tpex_dated_bulk_canary.py --date 2026-11-18 --date 2026-11-19
          echo "This was a read-only source probe; never approved for production writes." >> "$GITHUB_STEP_SUMMARY"
