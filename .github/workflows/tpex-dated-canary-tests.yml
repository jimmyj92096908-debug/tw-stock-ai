name: TPEx Dated Bulk Canary - Offline Safety Tests

on:
  pull_request:
    paths:
      - 'src/tpex_dated_bulk_canary.py'
      - 'src/tpex_dated_history.py'
      - 'tests/test_tpex_dated_bulk_canary.py'
      - 'tests/test_tpex_dated_history.py'
      - 'tests/test_tpex_dated_history_postgres.py'
      - '.github/workflows/tpex-dated-canary-tests.yml'
      - '.github/workflows/daily-tpex-dated-history.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-canary-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline parser dependency
        run: python -m pip install 'requests>=2.31,<3' 'psycopg[binary]>=3.2,<4'
      - name: Compile and verify fail-closed no-write behavior
        run: |
          python -m py_compile src/tpex_dated_bulk_canary.py src/tpex_dated_history.py tests/test_tpex_dated_bulk_canary.py tests/test_tpex_dated_history.py
          python -m unittest tests.test_tpex_dated_bulk_canary tests.test_tpex_dated_history -v
      - name: Probe two historical TPEx sessions without database access
        run: |
          python src/tpex_dated_bulk_canary.py --date 2026-11-18 --date 2026-11-19
          echo "This was a read-only source probe; never approved for production writes." >> "$GITHUB_STEP_SUMMARY"

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: stock_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d stock_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: .:src
      STOCK_CI_POSTGRES_URL: postgresql://test:test@127.0.0.1:5432/stock_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated database dependencies
        run: python -m pip install 'requests>=2.31,<3' 'psycopg[binary]>=3.2,<4'
      - name: Verify controlled dated import against real disposable PostgreSQL
        run: python -m unittest tests.test_tpex_dated_history_postgres -v
