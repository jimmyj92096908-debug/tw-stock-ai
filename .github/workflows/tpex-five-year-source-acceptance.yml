name: TPEx Five-Year Official Source Read-Only Acceptance

on:
  workflow_run:
    workflows:
      - "TPEx Five-Year Dated Market Full Free Campaign"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: twstock-tpex-five-year-source-acceptance-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  audit-source-no-write:
    if: >-
      github.repository == 'jimmyj92096908-debug/tw-stock-ai' &&
      github.ref == 'refs/heads/main' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.event == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .:src
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing free dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify independent read-only source and factor-staleness audit
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          python -m py_compile scripts/tpex_five_year_source_acceptance.py
          python -m unittest tests.test_tpex_five_year_source_acceptance -v
      - name: Audit actual five-year source coverage and free database capacity
        run: python scripts/tpex_five_year_source_acceptance.py --report tpex-five-year-source-audit.json
      - name: Preserve actual historical coverage and factor freshness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpex-five-year-source-readonly-acceptance
          path: tpex-five-year-source-audit.json
          retention-days: 14
          if-no-files-found: ignore
