name: Taiwan Stock AI - Import CSV History to PostgreSQL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check database secret is configured
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::GitHub Actions secret DATABASE_URL is not configured."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import history CSV files into PostgreSQL
        run: python src/db_storage.py

      - name: Report import completion
        run: echo "PostgreSQL import job completed. Credentials are not printed."
