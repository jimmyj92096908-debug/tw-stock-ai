name: TWSE 2022 AES Neon Per-Stock 246-Day Density (Offline)

on:
  pull_request:
    paths:
      - 'scripts/twse_2022_aes_neon_eligible_density_readonly.py'
      - 'tests/test_twse_2022_aes_neon_eligible_density_readonly.py'
      - '.github/workflows/twse-2022-aes-neon-eligible-density-offline.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/twse_2022_aes_neon_eligible_density_readonly.py'
      - 'tests/test_twse_2022_aes_neon_eligible_density_readonly.py'
      - '.github/workflows/twse-2022-aes-neon-eligible-density-offline.yml'

permissions:
  contents: read

jobs:
  current-listed-year-stock-date-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ''
      STOCK_ARCHIVE_KEY_HEX: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing free requirements
        run: python -m pip install -r requirements.txt
      - name: Test 162 AES plus 84 bulk per-stock/date coverage no credentials
        run: |
          unset PYTHONPATH
          python -m py_compile scripts/twse_2022_aes_neon_eligible_density_readonly.py
          python -m scripts.twse_2022_aes_neon_eligible_density_readonly --help >/dev/null
          python -m unittest tests.test_twse_2022_aes_neon_eligible_density_readonly -v
