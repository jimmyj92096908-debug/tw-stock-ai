name: TWSE 2024 800+ Full MA240 Read Only (No Derived Storage)

on:
  pull_request:
    paths:
      - 'scripts/twse_2024_full_market_ma240_readonly.py'
      - 'tests/test_twse_2024_full_market_ma240_readonly.py'
      - '.github/workflows/twse-2024-full-market-ma240-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/twse_2024_full_market_ma240_readonly.py'
      - '.github/workflows/twse-2024-full-market-ma240-readonly.yml'

permissions:
  contents: read

concurrency:
  group: twse-full-market-2024-raw-ma240-readonly
  cancel-in-progress: false

jobs:
  offline-full-cohort-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Test complete 242-session calendars, 5 feature vectors, no Neon writes
        run: |
          python -m py_compile scripts/twse_2024_full_market_ma240_readonly.py
          python -m unittest -v tests.test_twse_2024_full_market_ma240_readonly

  official-neon-read-only:
    needs: offline-full-cohort-guard
    if: >-
      github.repository == 'jimmyj92096908-debug/tw-stock-ai' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONPATH: .:src
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Stream 242 actual 2024 source dates for 800+ current-listed stocks
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          python scripts/twse_2024_full_market_ma240_readonly.py \
            --output twse-2024-full-ma240-aggregate.json
      - name: Validate cross-sectional MA240 and strict model-release blockers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('twse-2024-full-ma240-aggregate.json')
          d=json.loads(p.read_text())
          assert p.stat().st_size < 7000
          assert d['actual_2024_common_market_days']==242
          n=d['actual_current_listed_stocks_with_all_242_sessions']
          assert 800 <= n <= 1000
          assert d['total_official_price_rows_read']==242*n
          assert d['exact_ma240_prefix_parity_stock_count']==n
          assert d['technical_smc_12_feature_prefix_checks']==5
          assert d['single_streaming_readonly_query']
          assert d['source_bars_present_in_neon_before_test']
          assert d['new_2022_missing_source_days_obtained']==0
          assert not d['survivorship_free_asof_market_universe']
          assert not d['dividend_adjusted_total_return_verified']
          assert not d['independent_model_alpha_validated']
          assert not d['complete_five_year_model_released']
          assert d['neon_price_or_derived_rows_written']==0
          assert d['github_price_or_factor_artifacts_written']==0
          assert d['line_messages_sent']==0
          assert not d['live_trading_approved']
          print(json.dumps(d,ensure_ascii=False,sort_keys=True))
          PY
      # No public raw stock payload and no uploaded artifacts.
