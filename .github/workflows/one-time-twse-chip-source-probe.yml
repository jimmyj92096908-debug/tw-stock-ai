name: One-Time 2330 Full Chip Source Verify (READ ONLY)
on:
  push:
    branches: [feature/chip-history-source-validation-20261120]
    paths:
      - ".github/workflows/one-time-twse-chip-source-probe.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CHIP_HISTORY_WRITE_ENABLED: "no"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official parsing dependencies
        run: pip install requests "psycopg[binary]>=3.2,<4"
      - name: Verify read-only and official response guards offline
        run: |
          python -m unittest tests.test_chip_history_backfill -v
          python -m py_compile src/chip_history_backfill.py
      - name: Verify 2330 missing-day historical official source for all 25 real sessions (NO INSERT)
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Missing DATABASE_URL"; exit 1; fi
          python src/chip_history_backfill.py --stock 2330 --days 25 --verify-sources
