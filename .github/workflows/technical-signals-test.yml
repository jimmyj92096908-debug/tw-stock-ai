name: Technical signal tests

on:
  push:
    branches:
      - "feature/technical-indicators"
    paths:
      - "src/technical_signals.py"
      - "tests/test_technical_signals.py"
      - ".github/workflows/technical-signals-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run technical signal tests
        run: python -m unittest discover -s tests -p 'test_technical_signals.py' -v
