name: One-Time Authorized Data-Driven Composite Score Rebuild
on:
  push:
    branches: ["feature/line-stock-code-analysis"]
    paths:
      - ".github/workflows/composite-score-rebuild-once.yml"
permissions:
  contents: read
concurrency:
  group: composite-score-rebuild-once-20261120
  cancel-in-progress: false
jobs:
  rebuild:
    if: github.repository == 'jimmyj92096908-debug/tw-stock-ai' && github.ref == 'refs/heads/feature/line-stock-code-analysis'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install score dependencies
        run: pip install "psycopg[binary]>=3.2,<4" requests
      - name: Check score tests and bound source selection
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Missing DATABASE_URL"; exit 1; fi
          python -m unittest tests.test_composite_score tests.test_composite_score_selection tests.test_score_after_refresh -v
          python -m py_compile src/composite_score.py scripts/score_after_refresh.py
      - name: Recompute only stocks backed by matching daily prices and technical indicators
        run: python scripts/score_after_refresh.py
      - name: Verify latest score dates without exporting stock recipients
        run: |
          python - <<'PY'
          import os,psycopg
          from tdcc_data import normalize_database_url
          with psycopg.connect(normalize_database_url(os.environ['DATABASE_URL'])) as c:
            row=c.execute("SELECT MAX(as_of_date)::text AS last,COUNT(DISTINCT (market,stock_id)) FILTER (WHERE as_of_date=DATE '2026-11-19' AND total_score IS NOT NULL)::int AS current FROM public.daily_composite_scores WHERE total_score IS NOT NULL").fetchone()
          print('score_date=',row[0],'scored_on_2026-11-19=',row[1])
          PY
