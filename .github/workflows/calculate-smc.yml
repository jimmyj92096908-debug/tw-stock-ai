name: Calculate SMC from Neon

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install database dependency
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Calculate and upsert daily SMC
        working-directory: src
        run: python sync_smc.py
