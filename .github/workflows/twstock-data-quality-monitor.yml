name: TW Stock Data Quality Monitor (Read-Only)

on:
  # Independent scheduled fallback. GitHub limits the depth of workflow_run
  # chains; a source -> indicator -> score -> audit chain can otherwise stop.
  schedule:
    # 04:00 Asia/Taipei Tue-Sat, after the limited overnight history pipeline.
    - cron: "0 20 * * 1-5"
  workflow_run:
    workflows:
      - "Composite Scores After Verified Official Snapshot"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twstock-readonly-quality-monitor
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.repository == 'jimmyj92096908-debug/tw-stock-ai' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.repository.full_name == github.repository)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install database-only dependency
        run: pip install "psycopg[binary]>=3.2,<4"
      - name: Verify read-only database-audit code and tests
        run: |
          python -m py_compile src/stock_db_audit.py
          python -m unittest tests.test_stock_db_audit -v
      - name: Run real database audit in READ ONLY transaction
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Missing DATABASE_URL"; exit 1; fi
          python src/stock_db_audit.py --json > twstock-audit.json
      - name: Audit historical source, legacy adjusted units and frozen future research
        env:
          PYTHONPATH: .:src
        run: |
          set -euo pipefail
          python -m unittest tests.test_research_readonly_milestones -v
          python -m py_compile scripts/research_readonly_milestones.py
          # Reuse the existing monitor, Neon read-only SELECT, and free runner.
          python scripts/research_readonly_milestones.py --out twstock-research-milestones.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads(Path("twstock-research-milestones.json").read_text())
          s=x["official_history"]
          l=x["legacy_tpex_units"]
          f=x["future_research"]
          r=x["current_research"]
          text=(
              "### Official historical depth and model provenance (READ ONLY)\n"
              f"- Verified TPEx/TWSE dated-source sessions: {s['tpex_dated_verified_sessions']}/{s['twse_dated_verified_sessions']}\n"
              f"- Legacy adjusted TPEx volume/turnover unverified rows: {l['derived_volume_bad_or_missing']:,}/{l['derived_turnover_bad_or_missing']:,}\n"
              f"- TPEx latest valid scores: {r['tpex_latest_full_stack']}/{r['tpex_60_session_eligible']}\n"
              f"- TPEx FULL historical factor / score freshness: {r['tpex_historical_full_stack']}/{r['tpex_60_session_eligible']}; outstanding: {r['tpex_historical_repair_backlog']}\n"
              f"- Independently frozen prospective signal dates: {f['frozen_signal_days']}\n"
              "- Prospective frozen cohorts are NOT matured future results or proven trading alpha.\n"
              "- No raw price updates, LINE trade messages, orders or paid subscription changes.\n"
          )
          print(text)
          summary=os.environ.get("GITHUB_STEP_SUMMARY")
          if summary: Path(summary).open("a",encoding="utf-8").write(text)
          PY
      - name: Verify still-short TPEx prices without inventing listing dates
        env:
          PYTHONPATH: .:src
        run: |
          set -euo pipefail
          python -m unittest tests.test_tpex_short_history_gap_audit -v
          python scripts/tpex_short_history_gap_audit.py --out tpex-short-history-gap-evidence.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads(Path("tpex-short-history-gap-evidence.json").read_text(encoding="utf-8"))
          b=x["bands"]
          summary=(
              "### TPEx source-backed short-history audit (READ ONLY)\n"
              f"- Actual latest price day: {x['price_date']}\n"
              f"- Valid >=60-session TPEx: {x['eligible_real_60_session_history']}/{x['currently_priced']}\n"
              f"- Short history 50–59/40–49/30–39/20–29/0–19: "
              f"{b['50-59']}/{b['40-49']}/{b['30-39']}/{b['20-29']}/{b['0-19']}\n"
              "- First observed price date is NOT independently verified official listing date.\n"
              "- No fictitious trading days, price updates, LINE trade messages or orders.\n"
          )
          print(summary)
          if os.getenv("GITHUB_STEP_SUMMARY"):
              Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a",encoding="utf-8").write(summary)
          PY
      - name: Verify data integrity and publish sanitized summary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          audit=json.loads(Path('twstock-audit.json').read_text(encoding='utf-8'))
          rows=audit["coverage"]
          universe=sum(int(r["universe"]) for r in rows)
          covered=sum(int(r["priced"]) for r in rows)
          if universe<=0: raise SystemExit("No candidate stocks; audit invalid")
          q=audit["quality"]
          ready=audit["analysis_readiness"]
          cohort=audit["matched_cohort_coverage"]
          blockers=cohort["blocking_cohorts"]
          markets=audit["cohort_by_market"]
          if sum(r["master"] for r in markets)!=universe:
              raise SystemExit("Exact stock-master cohort denominator differs from coverage query")
          if cohort["complete"]>cohort["eligible"] or cohort["eligible"]>universe:
              raise SystemExit("Contradictory exact same-date cohort intersection")
          if (cohort["eligible"]+sum(blockers.values()) != universe or
              cohort["missing_eligible_matched_full_stack"]<0):
              raise SystemExit("Incomplete stock-master coverage partition")
          backlog=audit["indicator_backlog"]
          pending=sum(int(m["pending"]) for m in backlog)
          eligible=sum(int(m["eligible"]) for m in backlog)
          if any(int(m["eligible"])!=int(m["pending"])+int(m["complete"])
                 or int(m["unstarted"])>int(m["pending"]) for m in backlog):
              raise SystemExit("Indicator backlog inconsistent; audit invalid")
          fields=(
              "invalid_close","negative_volume","inverted_high_low",
              "close_above_high","close_below_low","future_price_date",
              "invalid_score","invalid_score_coverage","future_score_date"
          )
          bad=sum(int(q.get(key) or 0) for key in fields)
          lines=[
              "### Taiwan Stock DB Integrity",
              f"- Candidate stocks with history: {covered:,}/{universe:,} ({covered/universe:.1%})",
              f"- Last price date: {audit['latest']['latest_price_date']}",
              f"- Last score date: {audit['latest']['latest_score_date']}",
              f"- Stocks with 60 real trading sessions: {ready['history_60d']:,}",
              f"- Stocks with 120/240 sessions: {ready['history_120d']:,}/{ready['history_240d']:,}",
              f"- Technical/SMC stocks: {ready['technical_stocks']:,}/{ready['smc_stocks']:,}",
              f"- Stocks with score: {ready['scored_stocks']:,} of {covered:,} historical-price stocks",
              f"- Exact SAME-STOCK SAME-LAST-VALID-CLOSE technical + SMC + composite: {cohort['complete']:,}/{cohort['eligible']:,} currently eligible",
              f"- Full stock-master complete share: {cohort['complete']:,}/{cohort['master']:,} ({cohort['coverage_fraction_master']:.1%})",
              f"- Missing real >=60-session price history: {blockers['short_history']:,}; no valid close: {blockers['no_valid_price']:,}",
              f"- Sufficient but stale latest close: {blockers['stale_sufficient_history']:,}; research excluded: {blockers['research_excluded']:,}",
              f"- Missing among currently eligible matched full-stack: {cohort['missing_eligible_matched_full_stack']:,}",
              "- Eligible-stock current score coverage is NOT equivalent to full-exchange history or evidence of investment alpha.",
              f"- Scored on latest global price date: {ready['scored_latest_price_day']:,}",
              f"- Fresh 60+ session indicator backlog: {pending:,}/{eligible:,} eligible TWSE/TPEx stocks",
              *[f"- {m['market']} indicators pending/complete: {m['pending']}/{m['complete']} (unstarted {m['unstarted']})" for m in backlog],
              "- Pending counts are real read-only DB state, not an assertion that any backfill occurred.",
              f"- Basic invalid OHLC/score checks: {bad}",
              "- This is a read-only database integrity check, not an investment recommendation."
          ]
          summary="\n".join(lines)+"\n"
          print(summary)
          path=os.getenv("GITHUB_STEP_SUMMARY")
          if path: Path(path).open("a",encoding="utf-8").write(summary)
          if bad: raise SystemExit("Stored market data has validation errors")
          if covered/universe < 0.95:
              raise SystemExit("Market coverage dropped below 95%")
          PY
      - name: Retain aggregate-only audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twstock-readonly-quality-audit
          path: |
            twstock-audit.json
            twstock-research-milestones.json
            tpex-short-history-gap-evidence.json
          if-no-files-found: ignore
          retention-days: 7
