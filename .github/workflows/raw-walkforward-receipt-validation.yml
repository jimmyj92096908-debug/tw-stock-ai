name: Raw Walkforward Receipt Validation
on:
  pull_request:
    paths:
      - 'src/raw_factor_walkforward.py'
      - 'src/raw_expanding_walkforward.py'
      - 'tests/test_raw_walkforward_receipt_validation.py'
      - '.github/workflows/raw-walkforward-receipt-validation.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ".:src"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Run frozen receipt and deterministic fold regression tests
        run: python -m unittest -v tests.test_raw_walkforward_receipt_validation tests.test_raw_factor_walkforward tests.test_raw_expanding_walkforward
