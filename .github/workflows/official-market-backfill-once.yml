name: One-Time Authorized Official Market Snapshot Backfill
on:
  push:
    branches: ["feature/line-stock-code-analysis"]
    paths:
      - ".github/workflows/official-market-backfill-once.yml"
permissions:
  contents: read
concurrency:
  group: official-market-backfill-once-20261120
  cancel-in-progress: false
jobs:
  apply-snapshot:
    if: github.repository == 'jimmyj92096908-debug/tw-stock-ai' && github.ref == 'refs/heads/feature/line-stock-code-analysis'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install "psycopg[binary]>=3.2,<4" requests
      - name: Verify the read-only source parser and explicit authorization
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::DATABASE_URL missing"; exit 1; fi
          python -m unittest tests.test_official_market_feed -v
          python -m py_compile src/official_market_feed.py src/official_snapshot_ingest.py
      - name: Validate actual official dates and candidate coverage without writes
        run: python src/official_snapshot_ingest.py
      - name: Apply only missing price rows after snapshot was created
        env:
          STOCK_SNAPSHOT_WRITE_ENABLED: "yes"
        run: python src/official_snapshot_ingest.py --apply
      - name: Repeat to verify idempotency; must insert zero more rows
        env:
          STOCK_SNAPSHOT_WRITE_ENABLED: "yes"
        run: |
          output=$(python src/official_snapshot_ingest.py --apply)
          echo "$output"
          if echo "$output" | grep -Eq "新增 [1-9][0-9]* 筆"; then
            echo "::error::Second run inserted more records: idempotency issue"; exit 1
          fi
