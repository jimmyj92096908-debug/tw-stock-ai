name: One-Time Official Snapshot Read-Only Probe
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-official-snapshot-observe.yml"
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install read-only snapshot dependencies
        run: pip install "psycopg[binary]>=3.2,<4" requests
      - name: Validate official-market parser contract
        run: python -m unittest tests.test_official_market_feed -v
      - name: Verify official TWSE and TPEx snapshots without database writes
        run: python src/official_snapshot_ingest.py
