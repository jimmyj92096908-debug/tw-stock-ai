name: TPEx Dated Official Historical Backfill

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-tpex-dated-history.yml'
  schedule:
    # 02:30 Asia/Taipei Tue-Sat after the official daily market close.
    - cron: '30 18 * * 1-5'
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        required: true
        default: false
        description: '確定執行受控官方上櫃歷史行情回補？預設只預覽'

permissions:
  contents: read

concurrency:
  group: twstock-tpex-dated-official-history
  cancel-in-progress: false

jobs:
  bounded-tpex-history:
    if: >-
      github.repository == 'jimmyj92096908-debug/tw-stock-ai' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing project dependencies
        run: pip install -r requirements.txt
      - name: Verify dated-source parsing and bounded write gates
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Missing DATABASE_URL"; exit 1; fi
          python -m py_compile src/tpex_dated_bulk_canary.py src/tpex_dated_history.py
          python -m unittest tests.test_tpex_dated_bulk_canary tests.test_tpex_dated_history -v
      - name: List missing dates without HTTP requests or writes
        run: python src/tpex_dated_history.py --batch-days 4 --lookback-days 150
      - name: Backfill only exchange-verified missing TPEx price dates
        if: >-
          github.event_name == 'schedule' ||
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.apply == true)
        env:
          STOCK_TPEX_DATED_HISTORY_WRITE_ENABLED: 'yes'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = 'push' ]; then
            # One release-only campaign: at most six 10-day batches.
            # Each invocation commits its own accepted dates only after a
            # >=98% independent same-day close comparison (>=10 matches).
            # Stop on the first failure; previous successful batches remain.
            for batch in 1 2 3 4 5 6; do
              echo "### Release campaign: batch $batch of 6" >> "$GITHUB_STEP_SUMMARY"
              python src/tpex_dated_history.py --apply --batch-days 10 --lookback-days 150
            done
          else
            # Routine batch remains small for zero-additional-cost operation.
            python src/tpex_dated_history.py --apply --batch-days 4 --lookback-days 150
          fi
      - name: Confirm manual preview never wrote data
        if: github.event_name == 'workflow_dispatch' && inputs.apply != true
        run: echo 'Only read-only dry run occurred; production prices unchanged.'
