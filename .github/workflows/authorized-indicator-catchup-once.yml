# One-shot opt-in analytical catch-up; remove after verified result.
name: Authorized Indicator Catch-Up for Verified TWSE History (One Shot)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/authorized-indicator-catchup-once.yml
permissions:
  contents: read
concurrency:
  group: twstock-indicator-catchup
  cancel-in-progress: false
jobs:
  analyze:
    if: github.repository == 'jimmyj92096908-debug/tw-stock-ai' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project requirements
        run: pip install -r requirements.txt
      - name: Require credential and guard tests
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::DATABASE_URL missing"; exit 1; fi
          python -m unittest tests.test_batch_indicator_catchup tests.test_composite_score_selection -v
          python -m py_compile src/batch_indicator_catchup.py scripts/score_after_refresh.py
      - name: Preview candidate analysis batch without writes
        run: python src/batch_indicator_catchup.py --per-market 20
      - name: Recompute at most four batches of 20 history-qualified stocks
        env:
          STOCK_INDICATOR_CATCHUP_WRITE_ENABLED: "yes"
        run: |
          python - <<'PY'
          import os
          from batch_indicator_catchup import run
          total=0
          for batch in range(1,5):
              result=run(os.environ["DATABASE_URL"],apply=True,per_market=20)
              failed=[x for x in result if x["status"]!="verified"]
              done=sum(x["status"]=="verified" for x in result)
              total+=done
              print(f"Analysis batch {batch}/4: verified={done}, failed={len(failed)}")
              if failed: raise SystemExit("Indicator computation failed; do not claim full coverage")
          print(f"Additional verified stocks: {total}")
          if total<60: raise SystemExit("Unexpectedly low verified indicator throughput")
          PY
      - name: Recompute composite scores after successful indicator verification
        run: python scripts/score_after_refresh.py
      - name: Confirm scored stock growth without changing original quotes
        run: |
          python - <<'PY'
          import os,psycopg
          with psycopg.connect(os.environ['DATABASE_URL']) as conn:
              with conn.cursor() as cur:
                  cur.execute("""SELECT
                   (SELECT COUNT(DISTINCT (market,stock_id))::int FROM public.daily_technicals),
                   (SELECT COUNT(DISTINCT (market,stock_id))::int FROM public.daily_smc),
                   (SELECT COUNT(DISTINCT (market,stock_id))::int FROM public.daily_composite_scores
                    WHERE total_score IS NOT NULL)""")
                  tech,smc,scored=cur.fetchone()
          print(f"Verified analytical coverage: technical={tech}, smc={smc}, scored={scored}")
          if tech<120 or smc<120 or scored<120:
              raise SystemExit("Expected additional eligible stocks were not scored")
          PY
