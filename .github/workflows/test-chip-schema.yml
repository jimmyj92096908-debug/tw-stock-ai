name: Test Chip Data Schema
on:
  push:
    paths:
      - "sql/chip_schema.sql"
      - "docs/chip-data-sources.md"
      - "tests/test_chip_schema.py"
      - ".github/workflows/test-chip-schema.yml"
  pull_request:
    paths:
      - "sql/chip_schema.sql"
      - "docs/chip-data-sources.md"
      - "tests/test-chip_schema.py"
      - ".github/workflows/test-chip-schema.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile tests/test_chip_schema.py
      - run: python -m unittest tests.test_chip_schema -v
