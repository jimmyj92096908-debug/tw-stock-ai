name: TWSE 2022 Dated Dividend Ex-Reference (Offline Tests)

on:
  pull_request:
    paths:
      - 'scripts/twse_2022_dividend_exref_readonly.py'
      - 'tests/test_twse_2022_dividend_exref_readonly.py'
      - '.github/workflows/twse-2022-dividend-exref-offline.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/twse_2022_dividend_exref_readonly.py'
      - 'tests/test_twse_2022_dividend_exref_readonly.py'
      - '.github/workflows/twse-2022-dividend-exref-offline.yml'

permissions:
  contents: read

jobs:
  official-event-reference-offline-no-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ''
      STOCK_ARCHIVE_KEY_HEX: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing free requirements
        run: python -m pip install -r requirements.txt
      - name: Run exact 2022 ex-dividend reference, source-drift and safety tests
        run: |
          unset PYTHONPATH
          python -m py_compile scripts/twse_2022_dividend_exref_readonly.py
          python -m scripts.twse_2022_dividend_exref_readonly --help >/dev/null
          python -m unittest tests.test_twse_2022_dividend_exref_readonly -v
