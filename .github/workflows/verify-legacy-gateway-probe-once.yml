# TEMPORARY: Checks only an empty signed webhook event from isolated Neon test function.
# Delete immediately after results; never points LINE Developers to this probe.
name: Verify Existing LINE HMAC Empty Webhook (One Shot)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-legacy-gateway-probe-once.yml
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'jimmyj92096908-debug/tw-stock-ai' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call isolated Neon probe with NO user events or credentials
        env:
          PROBE_URL: https://br-gentle-scene-a19xw5qq-linestockanalysis.compute.c-1.ap-southeast-1.aws.neon.tech/verify-legacy-20261120-8fb29e3e8ab7dd2d
        run: |
          set -euo pipefail
          echo "Only the isolated probe computes HMAC and sends {events:[]}; no LINE messages or tokens."
          code=$(curl --silent --show-error --max-time 25 --output /tmp/probe.json --write-out '%{http_code}' "$PROBE_URL")
          echo "Probe HTTP status: $code"
          test "$code" = 200
          python - <<'PY'
          import json
          with open('/tmp/probe.json',encoding='utf-8') as f: result=json.load(f)
          for key in ('rejected_invalid_signature','accepted_signed_empty_event'):
              if not isinstance(result.get(key),int): raise SystemExit('Probe status unavailable')
          print('Existing webhook rejects bad signature with HTTP:', result['rejected_invalid_signature'])
          print('Existing webhook handles properly signed empty events with HTTP:', result['accepted_signed_empty_event'])
          if result['rejected_invalid_signature'] != 401: raise SystemExit('Webhook signature rejection differs from expected')
          if result['accepted_signed_empty_event'] != 200: raise SystemExit('Signed empty webhook event was not accepted')
          PY
