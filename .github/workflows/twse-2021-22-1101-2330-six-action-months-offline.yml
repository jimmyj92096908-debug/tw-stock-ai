name: TWSE 2021-22 1101 2330 Six Event Months (Offline)

on:
  push:
    paths:
      - 'scripts/twse_2021_22_frozen2_official_action_monthly_audit.py'
      - 'scripts/twse_2021_22_owner_twse_six_event_months_readonly.py'
      - 'tests/test_twse_2021_22_owner_twse_six_event_months_readonly.py'
      - 'docs/twse-2021-22-1101-2330-six-official-months.md'
      - '.github/workflows/twse-2021-22-1101-2330-six-action-months-offline.yml'
  pull_request:
    paths:
      - 'scripts/twse_2021_22_frozen2_official_action_monthly_audit.py'
      - 'scripts/twse_2021_22_owner_twse_six_event_months_readonly.py'
      - 'tests/test_twse_2021_22_owner_twse_six_event_months_readonly.py'
      - 'docs/twse-2021-22-1101-2330-six-official-months.md'
      - '.github/workflows/twse-2021-22-1101-2330-six-action-months-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  six-month-official-proof-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install established dependencies
        run: pip install -r requirements.txt
      - name: Compile and test standalone six-month exchange source proof
        run: |
          python -m py_compile scripts/twse_2021_22_owner_twse_six_event_months_readonly.py scripts/twse_2021_22_frozen2_official_action_monthly_audit.py
          python -m unittest -v tests.test_twse_2021_22_owner_twse_six_event_months_readonly tests.test_twse_2021_22_frozen2_official_action_monthly_audit
      - name: Maintain strict public, paid-free, no-Neon safety
        run: |
          echo "Synthetic exchange source only: no owner AES, database, LINE, original MOPS publication PIT or adjusted total-return claims."
