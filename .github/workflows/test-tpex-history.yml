name: Taiwan Stock AI - Test TPEx Historical Data

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-tpex-history.yml"

permissions:
  contents: read

jobs:
  test-tpex-history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install requests
      - name: Run TPEx parser unit tests
        run: python -m unittest tests.test_tpex_market_data -v

      - name: Test official TPEx per-stock monthly history endpoint
        run: |
          python - <<'PY'
          import json
          import re
          import requests
          from datetime import datetime
          from src.tpex_market_data import parse_roc_date

          assert parse_roc_date("113/09/26*") == "2024-09-26"
          assert parse_roc_date("115/10/01") == "2026-10-01"
          print("ROC date footnote parser test passed.")

          url = "https://www.tpex.org.tw/www/zh-tw/afterTrading/tradingStock"
          params = {
              "code": "6488",
              "date": "2026/10/01",
              "response": "json",
          }
          response = requests.get(
              url,
              params=params,
              headers={"User-Agent": "Mozilla/5.0", "Accept": "application/json"},
              timeout=30,
          )
          print("HTTP:", response.status_code)
          response.raise_for_status()
          payload = response.json()
          tables = payload.get("tables", [])
          if not tables:
              raise SystemExit("No tables found in TPEx response")
          rows = tables[0].get("data", [])
          print("Status:", payload.get("stat"))
          print("Title:", tables[0].get("title"))
          print("Subtitle:", tables[0].get("subtitle"))
          print("Rows:", len(rows))
          if not rows:
              raise SystemExit("No historical rows returned")
          parsed_dates = []
          for row in rows:
              raw_date = row[0]
              normalized = re.sub(r"[*＊]+$", "", raw_date.strip()).strip()
              match = re.fullmatch(r"(\d{2,3})/(\d{2})/(\d{2})", normalized)
              if not match:
                  raise SystemExit(f"Unexpected date format: {raw_date}")
              year, month, day = map(int, match.groups())
              parsed_dates.append(datetime(year + 1911, month, day).date())
          if parsed_dates != sorted(parsed_dates):
              raise SystemExit("Dates are not sorted")
          if len(parsed_dates) != len(set(parsed_dates)):
              raise SystemExit("Duplicate trading dates found")
          print("First row:", json.dumps(rows[0], ensure_ascii=False))
          print("Last row:", json.dumps(rows[-1], ensure_ascii=False))
          print("Date range:", parsed_dates[0], "to", parsed_dates[-1])
          print("TPEx historical monthly data test passed.")

      - name: Inspect TPEx stock 1295 November 2025 raw response
        run: |
          python - <<'PY'
          import json
          import requests

          response = requests.get(
              "https://www.tpex.org.tw/www/zh-tw/afterTrading/tradingStock",
              params={"code": "1295", "date": "2025/11/01", "response": "json"},
              headers={"User-Agent": "Mozilla/5.0", "Accept": "application/json"},
              timeout=30,
          )
          print("HTTP:", response.status_code)
          response.raise_for_status()
          payload = response.json()
          tables = payload.get("tables", [])
          if not tables:
              raise SystemExit("TPEx response has no tables")
          table = tables[0]
          rows = table.get("data", [])
          print("Status:", payload.get("stat"))
          print("Title:", table.get("title"))
          print("Subtitle:", table.get("subtitle"))
          print("Rows:", len(rows))
          for row in rows:
              if str(row[0]).startswith("114/11/"):
                  print("RAW:", json.dumps(row, ensure_ascii=False))
          PY
