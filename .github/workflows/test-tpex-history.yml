name: Taiwan Stock AI - Test TPEx Historical Data

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-tpex-history.yml"

permissions:
  contents: read

jobs:
  test-tpex-history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test official TPEx per-stock monthly history endpoint
        run: |
          python - <<'PY'
          import json
          import requests

          url = "https://www.tpex.org.tw/www/zh-tw/afterTrading/tradingStock"
          params = {
              "code": "6488",
              "date": "2026/10/01",
              "response": "json",
          }
          response = requests.get(
              url,
              params=params,
              headers={"User-Agent": "Mozilla/5.0", "Accept": "application/json"},
              timeout=30,
          )
          print("HTTP:", response.status_code)
          response.raise_for_status()
          payload = response.json()
          if not isinstance(payload, dict):
              raise SystemExit(f"Unexpected JSON type: {type(payload).__name__}")
          print("Top-level keys:", list(payload.keys()))
          print("Status:", payload.get("stat"))
          rows = payload.get("aaData") or payload.get("data") or []
          print("Rows:", len(rows))
          if rows:
              print("First row:", json.dumps(rows[0], ensure_ascii=False))
          else:
              print("Response preview:", json.dumps(payload, ensure_ascii=False)[:2000])
              raise SystemExit("No historical rows returned; endpoint/parameters need investigation")
          print("TPEx per-stock monthly history endpoint returned data.")
          PY
