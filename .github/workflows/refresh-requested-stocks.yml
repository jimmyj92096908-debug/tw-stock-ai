name: Refresh Tracked Stock Market Data

on:
  schedule:
    # 21:15 Taiwan time, Monday-Friday (GitHub Actions uses UTC).
    - cron: "15 13 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/update_requested_stocks.py"
      - ".github/workflows/refresh-requested-stocks.yml"

permissions:
  contents: read

concurrency:
  group: refresh-requested-stock-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check database secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing GitHub Actions secret DATABASE_URL"
            exit 1
          fi

      - name: Compile refresh and analysis modules
        run: |
          python -m py_compile \
            src/update_requested_stocks.py \
            src/market_data.py \
            src/tpex_market_data.py \
            src/db_storage.py \
            src/calculate_technicals.py \
            src/calculate_smc.py

      - name: Download latest monthly data, import to Neon, and recalculate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: src
        run: python src/update_requested_stocks.py
