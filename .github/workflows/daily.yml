name: Taiwan Stock AI - Daily Data

on:
  # 每個台灣交易日約 21:00 執行（GitHub 排程使用 UTC）。
  schedule:
    - cron: "0 13 * * 1-5"
  # 也可以在 GitHub Actions 頁面手動執行測試。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-stock-list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: 取得專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安裝 Python 套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 下載上市與上櫃股票清單
        run: python src/stock_list.py

      - name: 同步上市與上櫃股票至 Neon stock_master
        run: python src/sync_stock_master.py

      - name: 暫存股票清單成果
        uses: actions/upload-artifact@v4
        with:
          name: taiwan-stock-list
          path: data/stock_list.csv
          if-no-files-found: error
          retention-days: 7
