name: Indicator Catch-Up Savepoint Integration

on:
  pull_request:
    paths:
      - "src/batch_indicator_catchup.py"
      - "tests/test_batch_indicator_catchup.py"
      - "tests/test_batch_indicator_savepoint_postgres.py"
      - ".github/workflows/indicator-savepoint-integration.yml"
  push:
    branches: ["main"]
    paths:
      - "src/batch_indicator_catchup.py"
      - "tests/test_batch_indicator_catchup.py"
      - "tests/test_batch_indicator_savepoint_postgres.py"
      - ".github/workflows/indicator-savepoint-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: stock_ci_test
          POSTGRES_USER: stock_ci_test
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stock_ci_test -d stock_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: src
      STOCK_CI_POSTGRES_URL: postgresql://stock_ci_test:ci-disposable-only@127.0.0.1:5432/stock_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requirements and pytest
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<10"
      - name: Compile indicator code and execute offline and disposable-PG tests
        run: |
          python -m py_compile src/batch_indicator_catchup.py
          python -m unittest tests.test_batch_indicator_catchup tests.test_batch_indicator_savepoint_postgres -v
      - name: Run full Python regression suite including real PG rollback
        run: python -m pytest -q tests
      - name: Declare evidence boundary
        if: always()
        run: |
          {
            echo "### Indicator batch rollback verification"
            echo "- PostgreSQL 17 localhost disposable database only."
            echo "- A real SQL division-by-zero after partial dummy writes rolls back one symbol, while the next commits."
            echo "- The unit test verifies no private exception text leaks."
            echo "- No real Neon credentials, data changes, LINE sends, or GitHub schedule changes."
          } >> "$GITHUB_STEP_SUMMARY"
