name: Weekly TDCC Share Distribution Accumulation
on:
  schedule:
    - cron: "15 14 * * 3"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tw-stock-weekly-tdcc
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is missing."
            exit 1
          fi
      - name: Install dependencies
        run: pip install requests "psycopg[binary]>=3.2,<4"
      - name: Test TDCC parser
        run: python -m unittest tests.test_tdcc_data -v
      - name: Import latest official weekly snapshot
        run: python src/tdcc_data.py
      - name: Recalculate composite chip scores
        run: python src/chip_score.py
