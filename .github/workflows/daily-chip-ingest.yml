name: Daily Chip Data Accumulation
on:
  push:
    paths:
      - "src/daily_chip_ingest.py"
      - "src/institutional_data.py"
      - "src/margin_data.py"
      - "src/chip_score.py"
      - ".github/workflows/daily-chip-ingest.yml"
  schedule:
    - cron: "35 13 * * 1-5"
  workflow_dispatch:
    inputs:
      apply:
        description: "明確允許手動寫入籌碼資料及評分？預設不寫入"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: tw-stock-daily-chip-ingest
  cancel-in-progress: false
jobs:
  ingest:
    # A source push/PR is code review, never permission to write production.
    if: github.repository == 'jimmyj92096908-debug/tw-stock-ai' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.apply == true))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is missing."
            exit 1
          fi
      - name: Install dependencies
        run: pip install requests "psycopg[binary]>=3.2,<4"
      - name: Run parser tests
        run: |
          python -m unittest tests.test_institutional_data -v
          python -m unittest tests.test_margin_data -v
      - name: Import latest official daily chip snapshots
        run: python src/daily_chip_ingest.py
      - name: Recalculate bounded tracked-stock chip scores
        # Calculate only the explicit daily cohort; the historical backfill
        # remains a separate reviewed operation, not an automatic production job.
        run: python src/chip_score.py --stock-ids 2330,6213,4919,7827,8937
