name: Verify Chip Data Schema in Neon
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check database secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::GitHub Actions secret DATABASE_URL is missing"
            exit 1
          fi
      - name: Install database driver
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Verify existing chip tables and required columns
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import psycopg

          required = {
              "institutional_flows": {"market", "stock_id", "trade_date", "foreign_net", "trust_net", "dealer_net"},
              "margin_short": {"market", "stock_id", "trade_date", "margin_balance", "short_balance"},
              "tdcc_share_distribution": {"stock_id", "as_of_date", "holder_range", "holder_count", "share_count"},
              "insider_holdings": {"market", "stock_id", "as_of_date", "person_name", "person_role", "share_count", "pledged_shares"},
          }
          with psycopg.connect(os.environ["DATABASE_URL"]) as conn:
              rows = conn.execute("""
                  SELECT table_name, column_name
                  FROM information_schema.columns
                  WHERE table_schema = 'public' AND table_name = ANY(%s)
              """, (list(required),)).fetchall()
          actual = {}
          for table, column in rows:
              actual.setdefault(table, set()).add(column)
          failures = []
          for table, columns in required.items():
              missing = sorted(columns - actual.get(table, set()))
              if missing:
                  failures.append(f"{table}: missing {missing}")
              else:
                  print(f"OK {table}: {len(columns)} required columns verified")
          if failures:
              raise SystemExit("; ".join(failures))
          print("All four existing chip tables match the ingestion contract.")
          PY
