# One-time boolean-only presence check. Never prints secret values.
name: Verify Live Integration Secret Availability (One Shot)
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-live-integration-secret-availability-once.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'jimmyj92096908-debug/tw-stock-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - name: Report only whether protected credentials exist (not their values)
        run: |
          if [ -n "$LINE_CHANNEL_SECRET" ]; then
            echo "LINE_CHANNEL_SECRET configured=true"
          else
            echo "LINE_CHANNEL_SECRET configured=false"
          fi
          if [ -n "$LINE_CHANNEL_ACCESS_TOKEN" ]; then
            echo "LINE_CHANNEL_ACCESS_TOKEN configured=true"
          else
            echo "LINE_CHANNEL_ACCESS_TOKEN configured=false"
          fi
          if [ -n "$NEON_API_KEY" ]; then
            echo "NEON_API_KEY configured=true"
          else
            echo "NEON_API_KEY configured=false"
          fi
