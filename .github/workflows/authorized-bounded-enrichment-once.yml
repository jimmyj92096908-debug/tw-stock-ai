# One-shot authorization from the owner on 2026-11-20.
# Remove this workflow from the feature branch after inspecting the run.
name: Authorized Bounded Historical Enrichment (One Shot)
on:
  push:
    branches:
      - feature/line-stock-code-analysis
    paths:
      - .github/workflows/authorized-bounded-enrichment-once.yml

permissions:
  contents: read

concurrency:
  group: twstock-authorized-enrichment-once
  cancel-in-progress: false

jobs:
  enrich:
    if: github.repository == 'jimmyj92096908-debug/tw-stock-ai' && github.ref == 'refs/heads/feature/line-stock-code-analysis'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install approved dependencies
        run: pip install -r requirements.txt
      - name: Require DB secret and compile importer
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::DATABASE_URL is missing"; exit 1; fi
          python -m py_compile src/bounded_history_enrichment.py src/full_market_refresh.py src/calculate_smc.py src/calculate_technicals.py src/build_adjusted_prices.py
      - name: Test all strict backfill gates before any writes
        run: python -m unittest tests.test_bounded_history_enrichment tests.test_full_market_refresh -v
      - name: Show official history request plan, without DB writes
        run: python src/bounded_history_enrichment.py --per-market 2
      - name: Apply authorized bounded history and recompute indicators
        env:
          STOCK_ENRICHMENT_WRITE_ENABLED: "yes"
        run: python src/bounded_history_enrichment.py --apply --per-market 2
      - name: Verify result counts and data freshness without writes
        run: |
          python - <<'PY'
          import os,psycopg
          with psycopg.connect(os.environ['DATABASE_URL']) as conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT COUNT(DISTINCT (market,stock_id)) FROM public.daily_prices WHERE close IS NOT NULL")
                  covered=cur.fetchone()[0]
                  cur.execute("SELECT COUNT(DISTINCT (market,stock_id)) FROM public.daily_technicals")
                  technical=cur.fetchone()[0]
                  cur.execute("SELECT COUNT(DISTINCT (market,stock_id)) FROM public.daily_smc")
                  smc=cur.fetchone()[0]
          print(f"Verified stock coverage: prices={covered}, technical={technical}, smc={smc}")
          if covered<1966 or technical<40 or smc<40:
              raise SystemExit("Unexpected decrease in data coverage")
          PY
