name: TWSE 6873 Innovation vs Regular Listing Provenance (Offline)

on:
  pull_request:
    paths:
      - 'scripts/twse_6873_innovation_regular_listing_official_readonly.py'
      - 'tests/test_twse_6873_innovation_regular_listing_official_readonly.py'
      - '.github/workflows/twse-6873-innovation-regular-provenance-offline.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/twse_6873_innovation_regular_listing_official_readonly.py'
      - 'tests/test_twse_6873_innovation_regular_listing_official_readonly.py'
      - '.github/workflows/twse-6873-innovation-regular-provenance-offline.yml'

permissions:
  contents: read

jobs:
  historical-first-trading-board-transition-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ''
      STOCK_ARCHIVE_KEY_HEX: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing free dependencies
        run: python -m pip install -r requirements.txt
      - name: Test official TWSE 6873 innovation board historical first listing, offline only
        run: |
          unset PYTHONPATH
          python -m py_compile scripts/twse_6873_innovation_regular_listing_official_readonly.py
          python -m scripts.twse_6873_innovation_regular_listing_official_readonly --help >/dev/null
          python -m unittest tests.test_twse_6873_innovation_regular_listing_official_readonly -v
