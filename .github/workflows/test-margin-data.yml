name: Test Margin Data Importer
on:
  push:
    paths:
      - "src/margin_data.py"
      - "tests/test_margin_data.py"
      - ".github/workflows/test-margin-data.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests "psycopg[binary]>=3.2,<4"
      - run: python -m py_compile src/margin_data.py
      - run: python -m unittest tests.test_margin_data -v
