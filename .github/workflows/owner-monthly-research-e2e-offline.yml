name: Owner Monthly Research E2E (Offline)
on:
  pull_request:
    paths:
      - 'scripts/owner_monthly_research_e2e_offline.py'
      - 'tests/test_owner_monthly_research_e2e_offline.py'
      - '.github/workflows/owner-monthly-research-e2e-offline.yml'
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python -m unittest -v tests.test_owner_monthly_research_e2e_offline tests.test_research_monthly_risk_receipt tests.test_research_monthly_ridge_hypothetical tests.test_research_monthly_fold_plan tests.test_research_entitlement_return
