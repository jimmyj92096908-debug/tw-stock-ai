# Temporary build transport for a reviewed Neon function ZIP on a feature branch.
# This workflow does NOT deploy to Neon or change LINE settings.
name: Publish Reviewable LINE Gateway Bundle Once
on:
  push:
    branches: [feature/production-readiness-20261120]
    paths:
      - .github/workflows/publish-gateway-preview-once.yml

permissions:
  contents: write

jobs:
  bundle:
    if: github.repository == 'jimmyj92096908-debug/tw-stock-ai' && github.ref == 'refs/heads/feature/production-readiness-20261120'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install and run Node unit tests
        working-directory: line-stock-analysis
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Bundle disabled gateway without credentials
        working-directory: line-stock-analysis
        run: |
          npm run bundle:candidate
          node --check candidate-dist/index.mjs
      - name: Export bundled JS to this feature branch for isolated staging
        run: |
          set -euo pipefail
          mkdir -p line-stock-analysis/staging-bundle
          cp line-stock-analysis/candidate-dist/index.mjs line-stock-analysis/staging-bundle/index.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f line-stock-analysis/staging-bundle/index.mjs
          git commit -m "Temp: publish tested disabled gateway bundle for Neon staging only"
          git push origin HEAD:feature/production-readiness-20261120
