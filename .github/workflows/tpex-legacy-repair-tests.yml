name: TPEx Legacy Derived 70-Stock Repair Safety

on:
  pull_request:
    paths:
      - 'scripts/tpex_legacy_derived_repair.py'
      - 'tests/test_tpex_legacy_derived_repair.py'
      - 'tests/test_tpex_legacy_derived_repair_postgres.py'
      - '.github/workflows/tpex-legacy-derived-repair.yml'
      - '.github/workflows/tpex-legacy-repair-tests.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Verify no-price-write and bounded score repair gates
        run: |
          python -m py_compile scripts/tpex_legacy_derived_repair.py
          python -m unittest tests.test_tpex_legacy_derived_repair tests.test_tpex_derived_units -v

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: stock_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d stock_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: .:src
      STOCK_CI_POSTGRES_URL: postgresql://test:test@127.0.0.1:5432/stock_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Validate legacy source unit audit on disposable PostgreSQL
        run: python -m unittest tests.test_tpex_legacy_derived_repair_postgres -v
